<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RemitWatch</title>
<style>
:root{--bg:#f6f7f9;--panel:#ffffff;--ink:#17202a;--muted:#5d6b7a;--line:#e3e7ec;--accent:#1f5fbf;--accent-ink:#fff;--bad:#b42318;--warn:#b54708;--good:#067647;--soft:#eef2f7;--chip:#eaf0fb}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f141a;--panel:#171e26;--ink:#e8edf2;--muted:#9aa7b4;--line:#2a3441;--accent:#6ea2ff;--accent-ink:#0b1220;--bad:#ff7b6b;--warn:#f0a35a;--good:#5fd39b;--soft:#1e2731;--chip:#22304a}}
:root[data-theme="dark"]{--bg:#0f141a;--panel:#171e26;--ink:#e8edf2;--muted:#9aa7b4;--line:#2a3441;--accent:#6ea2ff;--accent-ink:#0b1220;--bad:#ff7b6b;--warn:#f0a35a;--good:#5fd39b;--soft:#1e2731;--chip:#22304a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0 16px 0 0}
header .fresh{color:var(--muted);font-size:12px;flex:1 1 240px}
header select,header input,.filters select,.filters input,button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);cursor:pointer}
button{cursor:pointer}
nav{display:flex;flex-wrap:wrap;gap:4px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
nav a{padding:6px 10px;border-radius:6px;color:var(--muted);text-decoration:none;cursor:pointer}
nav a.active{background:var(--chip);color:var(--ink);font-weight:600}
main{padding:16px;max-width:1500px;margin:0 auto}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.kpi .v{font-size:22px;font-weight:700;margin-top:4px}
.kpi .l{color:var(--muted);font-size:12px}
.kpi .s{color:var(--muted);font-size:12px;margin-top:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px}
.panel h2{font-size:15px;margin:0 0 8px}
.two{grid-template-columns:1fr 1fr}
@media(max-width:900px){.two{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;white-space:nowrap;cursor:pointer}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.row:hover{background:var(--soft);cursor:pointer}
.chip{display:inline-block;padding:1px 7px;border-radius:999px;background:var(--chip);font-size:11px;margin-right:4px;white-space:nowrap}
.sev-high{color:var(--bad);font-weight:600}.sev-medium{color:var(--warn)}.sev-low,.sev-info{color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;align-items:center}
.muted{color:var(--muted)}
.note{color:var(--muted);font-size:12px;margin:4px 0 8px}
.pager{display:flex;gap:8px;align-items:center;margin-top:8px;color:var(--muted);font-size:12px}
#drawer{position:fixed;top:0;right:-760px;width:740px;max-width:100vw;height:100vh;background:var(--panel);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.2);overflow:auto;transition:right .2s;z-index:20;padding:16px}
#drawer.open{right:0}
#drawer h2{margin:0 0 6px;font-size:16px}
pre{background:var(--soft);padding:10px;border-radius:8px;overflow:auto;font-size:12px;white-space:pre-wrap}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:30;align-items:center;justify-content:center}
.modal.open{display:flex}
.modal .box{background:var(--panel);width:900px;max-width:96vw;max-height:92vh;overflow:auto;border-radius:10px;padding:16px}
.heat td{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--chip);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.actions button{margin-right:6px;margin-bottom:6px}
.legend{font-size:12px;color:var(--muted);columns:2;column-gap:24px}
.legend b{color:var(--ink)}
canvas{max-height:320px}
.small{font-size:12px}
.ok{color:var(--good)}
</style>
</head>
<body>
<header>
  <h1>RemitWatch</h1>
  <div class="fresh" id="fresh">loading…</div>
  <label class="small">Year <select id="yearSel"><option value="">All</option></select></label>
  <label class="small">Status <select id="statusSel"><option value="open">Open</option><option value="all">All</option><option value="appealed">Appealed</option><option value="resolved">Resolved</option><option value="dismissed">Dismissed</option></select></label>
  <button id="themeBtn" title="theme">◐</button>
</header>
<nav id="nav"></nav>
<main id="view"></main>
<div id="drawer"></div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const TABS = [
  ['overview','Overview'],['payers','Payers & rates'],['downcoding','Downcoding'],['bundling','Bundling & modifiers'],
  ['denials','Denials'],['contracts','Contracts & underpayment'],['fees','Fees & takebacks'],['appeals','Appeals queue'],['data','Data']
];
const SIGNAL_HELP = {
  DOWNCODE_SVC06:'Payer reported the code you billed (835 SVC06) and paid a lower level.',
  DOWNCODE_CHARGE:'Charge amount equals your fee for a higher level than the code the payer paid; the payer did not report the original code.',
  DOWNCODE_RATE:'Allowed amount equals the payer\'s usual rate for a lower level with no code change reported.',
  DOWNCODE_LEVEL_DENIED:'CARC 150/186 or RARC M25: payer says documentation does not support the level.',
  CODE_CHANGED:'Payer changed the procedure code (SVC06) outside the E/M, biopsy, repair and excision level families.',
  EM_BUNDLED_NO_MODIFIER:'E/M paid $0 as included in a same-day procedure and no modifier was billed. Correctable: add 25 if separately identifiable, resubmit.',
  EM_BUNDLED_MOD57_MINOR:'E/M-57 bundled; the same-day procedure has a 0/10-day global, so 57 is the wrong modifier. Correctable: use 25.',
  EM_BUNDLED_MOD57_MAJOR:'E/M-57 bundled although a 90-day global procedure was done. Appeal if the decision for surgery was made at this visit.',
  EM_BUNDLED_MOD25:'E/M-25 bundled into the procedure. Appeal with the note showing a separate, significant problem.',
  EM_BUNDLED_MOD24:'E/M-24 denied inside a global period. Appeal with documentation of the unrelated problem.',
  ADDON_BUNDLED:'Add-on code (17312, 11103, 17003 and similar) paid $0 as bundled. Add-ons are payable with their primary; appeal.',
  PROCEDURE_BUNDLED:'A procedure (Mohs stage, flap, repair) bundled into another same-day service. Appeal with NCCI tables.',
  DENIED_MISSING_MODIFIER:'CO-16 with remark N822/N823: missing or invalid modifier. Correct and resubmit.',
  DENIED_CODING:'Code or modifier combination rejected (CO-4 and similar). Correct and resubmit.',
  DENIED_MISSING_PRIMARY:'Add-on billed without a payable primary (CO-B15). Review the primary line.',
  DENIED_MISSING_INFO:'Claim lacks information (CO-16/226/227/252). Resubmit with what the remark code asks for.',
  DENIED_AUTH:'Authorization missing or exceeded (CO-197/198). Appeal or request retro-authorization; fix the front-end process.',
  DENIED_MEDICAL_NECESSITY:'Medical necessity or documentation (CO-50/B12/A1). Appeal with records.',
  DENIED_FREQUENCY:'Frequency or units (CO-151/119). Appeal with records.',
  DENIED_NONCOVERED:'Non-covered service. Verify benefits; bill the patient where allowed.',
  DENIED_TIMELY_FILING:'Timely filing (CO-29). Lost unless you can prove timely submission.',
  DENIED_PROVIDER:'Provider enrollment or credentialing (CO-B7/170). Fix the enrollment, then reprocess.',
  DENIED_DUPLICATE_UNPAID:'Denied as duplicate, but no remit ever paid this line. Find the original payment or reprocess.',
  DENIED_OTHER:'Paid $0 with another payer-responsibility reason code.',
  CLAIM_DENIED_UNPAID:'Whole claim denied (CLP02=4) and never paid later.',
  UNDERPAID_VS_OWN_RATE:'Allowed below the payer\'s own usual rate for this code and provider type, with no reduction reason reported.',
  MPPR_EXCESS:'Multiple-procedure reduction deeper than policy, or applied to an add-on code.',
  FEE_SKIM:'Payment fees withheld from the remittance (Zelis transaction fees, origination fees). Opt out: demand fee-free standard EFT.',
  TAKEBACK:'Overpayment recovery withheld from a later remittance (PLB WO). Review the reason and the recoupment notice.',
  CONTRACT_RATE_GAP:'Commercial payer\'s usual allowed is far below Medicare for a high-volume code. Renegotiate or reconsider participation.',
  MA_BELOW_MEDICARE:'Medicare Advantage payer\'s usual allowed is below the Medicare fee schedule. Check the contract terms.',
  G2211_DENIED:'G2211 denied most of the time by this payer: stop billing it there or appeal under the payer\'s policy.',
  MIPS_ADJUSTMENT:'Net MIPS adjustment on Medicare lines (positive = bonus).',
  SEQUESTRATION:'2 percent federal sequestration withheld on Medicare and MA lines (not recoverable).'
};
const state = {tab:'overview', year:'', status:'open', page:{}, filt:{}, summary:null, meta:null, charts:{}};
const HANDLING = {WRITE_OFF:'written off in EMA', TRANSFER_RESPONSIBILITY:'moved to patient in EMA', IGNORE:'ignored in EMA', MIXED:'mixed handling in EMA'};
const $ = s => document.querySelector(s);
const money = c => (c==null?'–':(c<0?'-':'')+'$'+Math.round(Math.abs(c)/100).toLocaleString());
const money2 = c => (c==null?'–':'$'+(c/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}));
const esc = s => String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function api(path, opts){ const r = await fetch(path, opts); if(!r.ok){ throw new Error(path+' '+r.status); } return r.json(); }
function qs(o){ return Object.entries(o).filter(([k,v])=>v!==''&&v!=null).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&'); }
function chart(id, cfg){ if(state.charts[id]) state.charts[id].destroy(); const el=document.getElementById(id); if(!el) return; state.charts[id]=new Chart(el, cfg); }
const palette = ['#1f5fbf','#d9534f','#f0ad4e','#5cb85c','#7b5ea7','#2aa198','#8c6d1f','#6c757d'];

function initNav(){
  $('#nav').innerHTML = TABS.map(([k,l])=>`<a data-tab="${k}" class="${k===state.tab?'active':''}">${l}</a>`).join('');
  $('#nav').querySelectorAll('a').forEach(a=>a.onclick=()=>{state.tab=a.dataset.tab; location.hash=state.tab; render();});
  $('#yearSel').onchange = e=>{state.year=e.target.value; render();};
  $('#statusSel').onchange = e=>{state.status=e.target.value; render();};
  $('#themeBtn').onclick = ()=>{const r=document.documentElement; r.dataset.theme = r.dataset.theme==='dark'?'light':'dark';};
  $('#modal').onclick = e=>{ if(e.target.id==='modal') $('#modal').classList.remove('open'); };
}
async function loadMeta(){
  state.meta = await api('/api/meta');
  const m = state.meta, r = m.remits||{}, runs = (m.runs||[])[0];
  $('#fresh').textContent = `${(r.n||0).toLocaleString()} remits · payments ${r.first_payment||'?'} to ${r.last_payment||'?'} · last analysis ${runs?runs.finished_at.replace('T',' ').slice(0,16):'never'} · files ${m.files?m.files.n:0}`;
}
async function loadSummary(){
  state.summary = await api('/api/summary?'+qs({year:state.year,status:state.status}));
  const ys = $('#yearSel'); const cur = ys.value;
  ys.innerHTML = '<option value="">All years</option>'+state.summary.years.map(y=>`<option value="${y}">${y}</option>`).join('');
  ys.value = cur;
}
async function render(){
  $('#nav').querySelectorAll('a').forEach(a=>a.classList.toggle('active',a.dataset.tab===state.tab));
  await loadSummary();
  const v = $('#view'); v.innerHTML = '<div class="muted">loading…</div>';
  const fn = {overview, payers, downcoding, bundling, denials, contracts, fees, appeals, data}[state.tab] || overview;
  try { await fn(v); } catch(e){ v.innerHTML = `<div class="panel">Error: ${esc(e.message)}</div>`; console.error(e); }
}
function sumBy(rows, key){ const m={}; rows.forEach(r=>{m[r[key]]=(m[r[key]]||0)+(r.shortfall_cents||0);}); return m; }
function sigRows(sigs){ return state.summary.by_signal.filter(r=>sigs.includes(r.signal)); }
function total(rows){ return rows.reduce((a,r)=>a+(r.shortfall_cents||0),0); }
function count(rows){ return rows.reduce((a,r)=>a+(r.n||0),0); }

// ---------------------------------------------------------------- overview
async function overview(v){
  const s = state.summary, cat = sumBy(s.by_category,'category');
  const appealable = s.by_actionable.find(r=>r.actionable==='appeal')||{}, fix = s.by_actionable.find(r=>r.actionable==='correct_and_resubmit')||{};
  const dl = Object.fromEntries(s.deadlines.map(d=>[d.bucket,d]));
  v.innerHTML = `
  <div class="grid kpis">
    ${kpi('Identified leakage', money(total(s.by_category)), 'all categories, '+(state.status==='all'?'all':'open')+' findings', 'overview')}
    ${kpi('Appealable', money(appealable.shortfall_cents), (appealable.n||0).toLocaleString()+' findings', 'appeals')}
    ${kpi('Correctable billing errors', money(fix.shortfall_cents), (fix.n||0).toLocaleString()+' lines to resubmit', 'appeals')}
    ${kpi('Contract gap vs Medicare', money(cat.contract), 'commercial and MA rates', 'contracts')}
    ${kpi('Bundled away', money(cat.bundling), 'E/M, add-ons, Mohs stages', 'bundling')}
    ${kpi('Denied, never paid', money(cat.denial), 'lines and whole claims', 'denials')}
    ${kpi('Downcoded', money(cat.downcoding), 'code or level reduced', 'downcoding')}
    ${kpi('Fees and takebacks', money(cat.fees), 'PLB withholds', 'fees')}
    ${kpi('Due in 30 days', money((dl.due_30d||{}).shortfall_cents), ((dl.due_30d||{}).n||0)+' appeals · expired '+money((dl.expired||{}).shortfall_cents), 'appeals')}
    ${kpi('Recovered on later remits', money((s.resolved_by_later_remit||{}).shortfall_cents), ((s.resolved_by_later_remit||{}).n||0)+' lines paid after rework (auto-resolved)', 'denials')}
  </div>
  <div class="grid two">
    <div class="panel"><h2>Leakage by month of service</h2><canvas id="cMonth"></canvas></div>
    <div class="panel"><h2>Leakage by payer</h2><canvas id="cPayer"></canvas></div>
  </div>
  <div class="panel"><h2>Signals</h2><div class="note">Click a row to see the findings.</div>
    <table><thead><tr><th>Signal</th><th>Category</th><th>Severity</th><th>Action</th><th class="num">Findings</th><th class="num">Dollars</th><th>What it means</th></tr></thead>
    <tbody>${s.by_signal.filter(r=>r.category!=='info').map(r=>`<tr class="row" data-sig="${r.signal}" data-cat="${r.category}"><td><code>${r.signal}</code></td><td>${r.category}</td><td class="sev-${r.severity}">${r.severity}</td><td>${r.actionable}</td><td class="num">${r.n.toLocaleString()}</td><td class="num">${money(r.shortfall_cents)}</td><td class="small muted">${esc(SIGNAL_HELP[r.signal]||'')}</td></tr>`).join('')}</tbody></table>
  </div>
  <div class="panel"><h2>Context</h2>${s.info.map(r=>`<div class="small">• ${esc(r.title)}</div>`).join('')||'<div class="muted small">No context rows yet.</div>'}</div>`;
  v.querySelectorAll('.kpi').forEach(k=>k.onclick=()=>{state.tab=k.dataset.go; render();});
  v.querySelectorAll('tr.row').forEach(tr=>tr.onclick=()=>{ const cat=tr.dataset.cat; state.tab = {downcoding:'downcoding',bundling:'bundling',denial:'denials',underpayment:'contracts',contract:'contracts',fees:'fees'}[cat]||'denials'; state.filt[state.tab]={signal:tr.dataset.sig}; render(); });
  // charts
  const months = [...new Set(s.by_month.map(r=>r.month))].sort(), cats=['downcoding','bundling','denial','underpayment','fees','contract'];
  chart('cMonth',{type:'bar',data:{labels:months,datasets:cats.map((c,i)=>({label:c,backgroundColor:palette[i],data:months.map(m=>{const r=s.by_month.find(x=>x.month===m&&x.category===c);return r?r.shortfall_cents/100:0;})}))},
    options:{responsive:true,scales:{x:{stacked:true},y:{stacked:true,ticks:{callback:v=>'$'+v.toLocaleString()}}},plugins:{legend:{position:'bottom'}}}});
  const bp = s.by_payer.slice(0,12);
  chart('cPayer',{type:'bar',data:{labels:bp.map(r=>r.payer_group),datasets:[{label:'dollars',backgroundColor:palette[0],data:bp.map(r=>r.shortfall_cents/100)}]},
    options:{indexAxis:'y',responsive:true,scales:{x:{ticks:{callback:v=>'$'+v.toLocaleString()}}},plugins:{legend:{display:false}}}});
}
function kpi(l,v,s,go){ return `<div class="kpi" data-go="${go}"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`; }

// ---------------------------------------------------------------- findings table (shared)
async function findingsTable(v, container, base, opts={}){
  const key = state.tab; const f = Object.assign({signal:'',payer:'',severity:'',actionable:'',q:'',deadline:'',handling:''}, state.filt[key]||{});
  const page = state.page[key]||0, limit = 100;
  const params = Object.assign({}, base, f, {year:state.year, status:state.status, limit, offset:page*limit, sort: opts.sort||'shortfall'});
  const res = await api('/api/findings?'+qs(params));
  const sigs = state.summary.by_signal.filter(r=>!base.category||base.category.split(',').includes(r.category)).map(r=>r.signal);
  const payers = state.summary.by_payer.map(r=>r.payer_group);
  container.innerHTML = `
    <div class="filters">
      <select data-f="signal"><option value="">All signals</option>${sigs.map(x=>`<option ${f.signal===x?'selected':''}>${x}</option>`).join('')}</select>
      <select data-f="payer"><option value="">All payers</option>${payers.map(x=>`<option ${f.payer===x?'selected':''}>${esc(x)}</option>`).join('')}</select>
      <select data-f="severity"><option value="">Any severity</option>${['high','medium','low'].map(x=>`<option ${f.severity===x?'selected':''}>${x}</option>`).join('')}</select>
      <select data-f="actionable"><option value="">Any action</option>${['appeal','correct_and_resubmit','review','opt_out','renegotiate'].map(x=>`<option ${f.actionable===x?'selected':''}>${x}</option>`).join('')}</select>
      <select data-f="deadline"><option value="">Any deadline</option><option value="valid" ${f.deadline==='valid'?'selected':''}>Still appealable</option><option value="due" ${f.deadline==='due'?'selected':''}>Due in 45 days</option><option value="expired" ${f.deadline==='expired'?'selected':''}>Expired</option></select>
      <select data-f="handling"><option value="">Any EMA handling</option>${Object.keys(HANDLING).map(x=>`<option value="${x}" ${f.handling===x?'selected':''}>${HANDLING[x]}</option>`).join('')}</select>
      <input data-f="q" placeholder="claim id, code, CARC…" value="${esc(f.q)}">
      <span class="muted small">${res.total.toLocaleString()} findings · ${money(res.shortfall_cents)}</span>
      <a class="small" href="/api/findings.csv?${qs(Object.assign({},base,f,{year:state.year,status:state.status}))}">Export CSV</a>
      ${opts.bulk?'<button id="bulkAppealed" class="small">Mark selected appealed</button>':''}
    </div>
    <table><thead><tr>${opts.bulk?'<th></th>':''}<th>DOS</th><th>Payer</th><th>Provider</th><th>Code</th><th>Finding</th><th class="num">Charge</th><th class="num">Allowed</th><th class="num">Expected</th><th class="num">Shortfall</th><th>CARC/RARC</th><th>Deadline</th><th>Status</th></tr></thead>
    <tbody>${res.items.map(r=>`<tr class="row" data-id="${r.finding_id}">${opts.bulk?`<td><input type="checkbox" class="sel" value="${r.finding_id}" onclick="event.stopPropagation()"></td>`:''}
      <td>${r.service_date||''}</td><td>${esc(r.payer_group)}</td><td class="small">${esc((r.rendering_provider_name||'').replace(/\s+/g,' ').trim())}</td>
      <td>${esc(r.original_procedure_code?r.original_procedure_code+'→':'')}${esc(r.procedure_code||'')}${r.modifiers?'-'+esc(r.modifiers):''}</td>
      <td><span class="sev-${r.severity}">●</span> ${esc(r.title)}<div class="small muted">${r.patient_control_number||''} ${r.ema_handling?'<span class="chip">'+esc(HANDLING[r.ema_handling]||r.ema_handling)+'</span>':''}</div></td>
      <td class="num">${money2(r.charge_cents)}</td><td class="num">${money2(r.allowed_cents)}</td><td class="num">${money2(r.expected_cents)}</td><td class="num"><b>${money2(r.shortfall_cents)}</b></td>
      <td class="small">${esc(r.carc||'')}${r.rarc?'<br>'+esc(r.rarc):''}</td><td class="small ${r.appeal_deadline&&r.appeal_deadline<new Date().toISOString().slice(0,10)?'sev-high':''}">${r.appeal_deadline||''}</td><td><span class="chip">${r.status}</span></td></tr>`).join('')}</tbody></table>
    <div class="pager"><button id="prev" ${page===0?'disabled':''}>‹ prev</button><span>page ${page+1} of ${Math.max(1,Math.ceil(res.total/limit))}</span><button id="next" ${(page+1)*limit>=res.total?'disabled':''}>next ›</button></div>`;
  container.querySelectorAll('[data-f]').forEach(el=>el.onchange=()=>{ state.filt[key]=Object.assign({}, f, {[el.dataset.f]:el.value}); state.page[key]=0; render(); });
  container.querySelector('#prev').onclick=()=>{state.page[key]=page-1; render();};
  container.querySelector('#next').onclick=()=>{state.page[key]=page+1; render();};
  container.querySelectorAll('tr.row').forEach(tr=>tr.onclick=()=>openDetail(tr.dataset.id));
  const b = container.querySelector('#bulkAppealed'); if(b) b.onclick=async()=>{ const ids=[...container.querySelectorAll('.sel:checked')].map(x=>x.value); if(!ids.length) return; await api('/api/findings/bulk-status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ids,status:'appealed'})}); render(); };
}
async function trendChart(id, params, label){
  const rows = await api('/api/trends?'+qs(params));
  const months=[...new Set(rows.map(r=>r.month))].sort();
  const totals={}; rows.forEach(r=>{totals[r.grp]=(totals[r.grp]||0)+r.n;});
  const groups=Object.keys(totals).sort((a,b)=>totals[b]-totals[a]).slice(0,6);
  chart(id,{type:'line',data:{labels:months,datasets:groups.map((g,i)=>({label:g,borderColor:palette[i],backgroundColor:palette[i],tension:.2,pointRadius:2,data:months.map(m=>{const r=rows.find(x=>x.month===m&&x.grp===g);return r?r.n:0;})}))},
    options:{plugins:{legend:{position:'bottom'},title:{display:true,text:label}},scales:{y:{beginAtZero:true,title:{display:true,text:'lines per month of service'}}}}});
}
function legend(sigs){ return `<div class="legend">${sigs.map(s=>`<div><b>${s}</b>: ${esc(SIGNAL_HELP[s]||'')}</div>`).join('')}</div>`; }

async function downcoding(v){
  const sigs=['DOWNCODE_SVC06','DOWNCODE_CHARGE','DOWNCODE_RATE','DOWNCODE_LEVEL_DENIED','CODE_CHANGED'];
  v.innerHTML = `<div class="panel"><h2>Downcoding: ${money(total(sigRows(sigs)))} across ${count(sigRows(sigs)).toLocaleString()} lines</h2>
    <div class="note">Three independent detectors: the payer's own SVC06 field, the charge amount fingerprint, and the allowed-amount fingerprint. On this practice's history the charge fingerprint agreed with SVC06 in every case where both existed. The chart shows when each payer starts and stops: downcoding programs come and go.</div>${legend(sigs)}</div>
    <div class="panel"><canvas id="cTrend"></canvas></div>
    <div class="panel" id="tbl"></div>`;
  await trendChart('cTrend', {category:'downcoding'}, 'Downcoded lines per month by payer (all statuses)');
  await findingsTable(v, v.querySelector('#tbl'), {category:'downcoding'});
}
async function bundling(v){
  const sigs=['EM_BUNDLED_MOD25','EM_BUNDLED_MOD57_MAJOR','EM_BUNDLED_MOD57_MINOR','EM_BUNDLED_NO_MODIFIER','EM_BUNDLED_MOD24','ADDON_BUNDLED','PROCEDURE_BUNDLED'];
  v.innerHTML = `<div class="panel"><h2>Bundled away: ${money(total(sigRows(sigs)))} across ${count(sigRows(sigs)).toLocaleString()} lines</h2>
    <div class="note">Lines paid $0 inside otherwise paid claims with CARC 97, B10, 236, 234 or remark M80/N19/M15. These never show up as a denied claim.</div>${legend(sigs)}</div>
    <div class="panel"><canvas id="cTrend"></canvas></div>
    <div class="panel" id="tbl"></div>`;
  await trendChart('cTrend', {category:'bundling'}, 'Bundled lines per month by payer (all statuses)');
  await findingsTable(v, v.querySelector('#tbl'), {category:'bundling'});
}
async function denials(v){
  const rows = state.summary.by_signal.filter(r=>r.category==='denial');
  v.innerHTML = `<div class="panel"><h2>Denied and never paid: ${money(total(rows))} across ${count(rows).toLocaleString()} lines and claims</h2>
    <div class="grid two"><div><canvas id="cDen"></canvas></div><div>${legend(rows.map(r=>r.signal))}</div></div></div>
    <div class="panel" id="tbl"></div>`;
  chart('cDen',{type:'bar',data:{labels:rows.map(r=>r.signal.replace('DENIED_','').replace('CLAIM_','')),datasets:[{label:'dollars',backgroundColor:palette[1],data:rows.map(r=>r.shortfall_cents/100)}]},options:{indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{ticks:{callback:v=>'$'+v.toLocaleString()}}}}});
  await findingsTable(v, v.querySelector('#tbl'), {category:'denial'});
}
async function contracts(v){
  const c = state.summary.by_signal.filter(r=>r.category==='contract'), u = state.summary.by_signal.filter(r=>r.category==='underpayment');
  const year = state.year || state.summary.years[state.summary.years.length-1];
  const mx = await api('/api/rates/matrix?'+qs({year, tier: state.filt.tier||'physician'}));
  v.innerHTML = `<div class="panel"><h2>Contract rate gaps: ${money(total(c))} at Medicare parity · underpaid lines: ${money(total(u))}</h2>
    <div class="note">Usual allowed per payer, code and provider type is the most common allowed amount on cleanly paid primary lines (highest-ranked procedure on the claim, one unit, no code change). "% of Medicare" compares it to the same code on this practice's own Medicare remits for the same year and provider type.</div>${legend(['CONTRACT_RATE_GAP','MA_BELOW_MEDICARE','UNDERPAID_VS_OWN_RATE','MPPR_EXCESS'])}</div>
    <div class="panel"><h2>Allowed amount as % of Medicare, ${year} <select id="tierSel"><option value="physician" ${(state.filt.tier||'physician')==='physician'?'selected':''}>physicians</option><option value="nonphysician" ${state.filt.tier==='nonphysician'?'selected':''}>PAs / NPs</option></select></h2>
      <table class="heat"><thead><tr><th>Payer</th><th>Kind</th>${mx.codes.map(c=>`<th class="num">${c}</th>`).join('')}</tr></thead>
      <tbody>${mx.payers.slice(0,25).map(p=>`<tr><td style="text-align:left">${esc(p.payer_group)}</td><td style="text-align:left" class="small muted">${p.payer_kind}</td>${mx.codes.map(c=>{const x=p.codes[c]; if(!x) return '<td class="muted">·</td>'; const pct=x.pct; const col = pct==null?'':(pct<0.8?'var(--bad)':(pct<0.95?'var(--warn)':'var(--good)')); return `<td title="${money2(x.cents)} on ${x.n} lines; Medicare ${money2(x.medicare_cents)}" style="color:${col}">${money2(x.cents)}<div class="small">${pct==null?'':Math.round(pct*100)+'%'}</div></td>`;}).join('')}</tr>`).join('')}</tbody></table></div>
    <div class="panel"><h2>Contract-level findings</h2><div id="tblC"></div></div>
    <div class="panel"><h2>Underpaid lines</h2><div id="tblU"></div></div>`;
  v.querySelector('#tierSel').onchange=e=>{state.filt.tier=e.target.value; render();};
  const saveTab = state.tab;
  state.tab='contractsC'; await findingsTable(v, v.querySelector('#tblC'), {category:'contract'});
  state.tab='contractsU'; await findingsTable(v, v.querySelector('#tblU'), {category:'underpayment'});
  state.tab=saveTab;
}
async function fees(v){
  const vol = await api('/api/volume');
  const months=[...new Set(vol.plb.map(r=>r.month))].sort();
  const fee = state.summary.by_signal.find(r=>r.signal==='FEE_SKIM')||{}, tb = state.summary.by_signal.find(r=>r.signal==='TAKEBACK')||{};
  v.innerHTML = `<div class="grid kpis">${kpi('Payment fees withheld', money(fee.shortfall_cents), (fee.n||0)+' payer-months (Zelis, origination fees)','fees')}${kpi('Takebacks ≥ $500', money(tb.shortfall_cents), (tb.n||0)+' recoupments','fees')}
    ${state.summary.info.filter(r=>r.signal==='MIPS_ADJUSTMENT').map(r=>kpi('MIPS '+r.year, money(r.shortfall_cents), 'net adjustment (positive = bonus)','fees')).join('')}</div>
    <div class="panel"><h2>Provider-level adjustments (PLB) by month</h2><div class="note">WO = overpayment recovery, FB = forwarding balance, CS = adjustment (Zelis transaction fees appear here), AH = origination fee, L6 = interest.</div><canvas id="cPlb"></canvas></div>
    <div class="panel" id="tbl"></div>`;
  const codes=['WO','CS','AH','FB','L6','72','J1'];
  chart('cPlb',{type:'bar',data:{labels:months,datasets:codes.map((c,i)=>({label:c,backgroundColor:palette[i],data:months.map(m=>{const r=vol.plb.find(x=>x.month===m&&x.reason_code===c);return r?r.cents/100:0;})}))},options:{scales:{x:{stacked:true},y:{stacked:true,ticks:{callback:v=>'$'+v.toLocaleString()}}},plugins:{legend:{position:'bottom'}}}});
  await findingsTable(v, v.querySelector('#tbl'), {category:'fees'}, {sort:'date'});
}
async function payers(v){
  const ps = await api('/api/payers');
  const prov = await api('/api/providers');
  v.innerHTML = `<div class="grid two"><div class="panel"><h2>By payer</h2><table><thead><tr><th>Payer</th><th>Kind</th><th class="num">Findings</th><th class="num">Open $</th><th class="num">All $</th></tr></thead>
    <tbody>${ps.map(r=>`<tr class="row" data-p="${esc(r.payer_group)}"><td>${esc(r.payer_group)}</td><td class="small muted">${r.payer_kind}</td><td class="num">${r.findings.toLocaleString()}</td><td class="num">${money(r.open_cents)}</td><td class="num">${money(r.shortfall_cents)}</td></tr>`).join('')}</tbody></table></div>
    <div class="panel"><h2>By rendering provider</h2><table><thead><tr><th>Provider</th><th>NPI</th><th>Type</th><th class="num">Findings</th><th class="num">Dollars</th></tr></thead>
    <tbody>${prov.map(r=>`<tr><td>${esc(r.name||'')}</td><td class="small muted">${r.npi}</td><td class="small">${r.tier||''}</td><td class="num">${r.findings.toLocaleString()}</td><td class="num">${money(r.shortfall_cents)}</td></tr>`).join('')}</tbody></table></div></div>`;
  v.querySelectorAll('tr.row').forEach(tr=>tr.onclick=()=>{ state.tab='denials'; state.filt.denials={payer:tr.dataset.p}; render(); });
}
async function appeals(v){
  const dl = Object.fromEntries(state.summary.deadlines.map(d=>[d.bucket,d]));
  v.innerHTML = `<div class="grid kpis">${kpi('Due within 30 days', money((dl.due_30d||{}).shortfall_cents), ((dl.due_30d||{}).n||0)+' findings','appeals')}${kpi('Due within 90 days', money((dl.due_90d||{}).shortfall_cents), ((dl.due_90d||{}).n||0)+' findings','appeals')}${kpi('Later', money((dl.later||{}).shortfall_cents), ((dl.later||{}).n||0)+' findings','appeals')}${kpi('Expired', money((dl.expired||{}).shortfall_cents), ((dl.expired||{}).n||0)+' findings (deadlines are estimates)','appeals')}</div>
    <div class="panel"><h2>Work queue</h2><div class="note">Everything open that is either appealable or a correctable billing error, soonest deadline first. Open a row for the evidence and a ready-to-send letter. Deadlines are estimated from the remittance date and the payer type; confirm against the contract.</div><div id="tbl"></div></div>`;
  if(!state.filt.appeals) state.filt.appeals={deadline:'valid'};
  await findingsTable(v, v.querySelector('#tbl'), {category:'downcoding,bundling,denial,underpayment'}, {sort:'deadline', bulk:true});
}

  const m = state.meta;
  v.innerHTML = `<div class="grid two">
    <div class="panel"><h2>What is loaded</h2><table>
      <tr><td>Files ingested</td><td class="num">${(m.files.n||0).toLocaleString()} (${m.files.n835||0} remits, ${m.files.nema||0} EMA exports)</td></tr>
      <tr><td>Last ingest</td><td class="num">${m.files.last_ingest||'–'}</td></tr>
      <tr><td>Remittances</td><td class="num">${(m.remits.n||0).toLocaleString()} · ${money(m.remits.total_cents)}</td></tr>
      <tr><td>Payment dates</td><td class="num">${m.remits.first_payment} → ${m.remits.last_payment}</td></tr>
      <tr><td>Service lines</td><td class="num">${(m.lines.n||0).toLocaleString()} · DOS ${m.lines.first_dos} → ${m.lines.last_dos}</td></tr>
      ${m.ema.map(e=>`<tr><td>EMA ${e.family}</td><td class="num">${e.n.toLocaleString()} rows · DOS ${e.first_dos} → ${e.last_dos}</td></tr>`).join('')}
      ${m.sync.map(s=>`<tr><td>${s.key}</td><td class="num small">${esc(s.value).slice(0,80)}</td></tr>`).join('')}
    </table></div>
    <div class="panel"><h2>Analysis runs</h2><table><thead><tr><th>Run</th><th>Finished</th><th class="num">Lines</th><th class="num">Findings</th></tr></thead><tbody>${m.runs.map(r=>`<tr><td class="small">${r.run_id}</td><td class="small">${r.finished_at}</td><td class="num">${r.lines.toLocaleString()}</td><td class="num">${r.findings.toLocaleString()}</td></tr>`).join('')}</tbody></table></div>
  </div>
  <div class="panel"><h2>Data the practice still needs to supply</h2>
    <ol class="small">

    </ol></div>`;

// ---------------------------------------------------------------- detail drawer and appeal packet
async function openDetail(id){
  const d = $('#drawer'); d.classList.add('open'); d.innerHTML='<div class="muted">loading…</div>';
  const r = await api('/api/findings/'+id); const f=r.finding, cl=r.claim||{}, rem=r.remit||{};
  const adjBy = {}; (r.adjustments||[]).forEach(a=>{(adjBy[a.line_key||'claim']=adjBy[a.line_key||'claim']||[]).push(a);});
  const remBy = {}; (r.remarks||[]).forEach(a=>{(remBy[a.line_key||'claim']=remBy[a.line_key||'claim']||[]).push(a);});
  d.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:start"><h2>${esc(f.title)}</h2><button id="closeD">✕</button></div>
    <div class="small muted">${f.signal} · <span class="sev-${f.severity}">${f.severity}</span> · ${f.actionable} · status <b>${f.status}</b></div>
    <div class="note">${esc(SIGNAL_HELP[f.signal]||'')}</div>
    <div class="actions"><button class="primary" id="btnAppeal">${f.actionable==='correct_and_resubmit'?'Correction instructions':'Appeal packet'}</button>
      ${['open','in_progress','appealed','resolved','dismissed'].map(s=>`<button data-st="${s}" ${f.status===s?'disabled':''}>${s}</button>`).join('')}</div>
    <table class="small">
      <tr><td>Claim (CLP01)</td><td><b>${f.patient_control_number||''}</b> · payer claim # ${cl.payer_claim_control_number||''} · patient ${cl.patient||''}</td></tr>
      <tr><td>Payer</td><td>${esc(f.payer_name)} (${esc(f.payer_group)}, ${f.payer_kind}) · ${rem.payer_contact_phone||''} ${rem.payer_contact_url||''}</td></tr>
      <tr><td>Remit</td><td>trace ${rem.trace_number||''} · paid ${rem.payment_date||''} · ${rem.payment_method||''} ${money2(rem.payment_amount_cents)} · file ${esc(rem.source_name||'')}</td></tr>
      <tr><td>Service</td><td>DOS ${f.service_date||''} · provider ${esc(f.rendering_provider_name||'')} (${f.rendering_provider_npi||''}, ${f.provider_tier||''})</td></tr>
      <tr><td>Money</td><td>charge ${money2(f.charge_cents)} · allowed ${money2(f.allowed_cents)} · paid ${money2(f.paid_cents)} · expected ${money2(f.expected_cents)} · <b>shortfall ${money2(f.shortfall_cents)}</b></td></tr>
      <tr><td>Codes</td><td>${f.carc?esc(f.carc)+': '+esc(f.carc_text):''} ${f.rarc?'<br>'+esc(f.rarc)+': '+esc(f.rarc_text):''}</td></tr>
      <tr><td>Deadline</td><td>${f.appeal_deadline||'–'} (estimated)</td></tr>
    </table>
    <h3 class="small">Claim lines on this remit</h3>
    <table class="small"><thead><tr><th>#</th><th>Code</th><th>Submitted</th><th class="num">Charge</th><th class="num">Allowed</th><th class="num">Paid</th><th>Adjustments</th></tr></thead>
    <tbody>${(r.lines||[]).map(l=>`<tr ${l.line_key===f.line_key?'style="background:var(--chip)"':''}><td>${l.line_seq}</td><td>${l.procedure_code}${l.modifiers?'-'+JSON.parse(l.modifiers).join(','):''}</td><td>${l.original_procedure_code||''}</td><td class="num">${money2(l.charge_cents)}</td><td class="num">${money2(l.allowed_cents)}</td><td class="num">${money2(l.paid_cents)}</td>
      <td>${(adjBy[l.line_key]||[]).map(a=>`<div>${a.group_code}-${a.reason_code} ${money2(a.amount_cents)} <span class="muted">${esc(a.text)}</span></div>`).join('')}${(remBy[l.line_key]||[]).map(a=>`<div class="muted">${a.code} ${esc(a.text)}</div>`).join('')}</td></tr>`).join('')}</tbody></table>
    ${(adjBy.claim||[]).length?`<div class="small">Claim-level: ${adjBy.claim.map(a=>a.group_code+'-'+a.reason_code+' '+money2(a.amount_cents)).join(', ')}</div>`:''}
    <h3 class="small">All remits for this claim</h3>
    <table class="small"><thead><tr><th>Paid</th><th>Status</th><th>Payer</th><th class="num">Charge</th><th class="num">Paid</th><th>Trace</th></tr></thead><tbody>${(r.history||[]).map(h=>`<tr><td>${h.payment_date||''}</td><td>${h.claim_status_code}</td><td>${esc(h.payer_name)}</td><td class="num">${money2(h.charge_cents)}</td><td class="num">${money2(h.paid_cents)}</td><td class="small">${h.trace_number||''}</td></tr>`).join('')}</tbody></table>
    ${r.link?`<div class="small"><b>EMA charge link:</b> ${r.link.state}${r.link.ema_cpt?' · billed '+esc(r.link.ema_cpt)+(r.link.ema_modifiers?'-'+JSON.parse(r.link.ema_modifiers).join(','):'')+' x'+r.link.ema_units+' '+money2(r.link.ema_charges_cents)+' (bill item '+(r.link.bill_item_id||'')+', status '+esc(r.link.ema_claim_status||'')+')':''} ${r.link.cause?'· '+esc(r.link.cause):''}</div>`:''}
    ${(r.handling||[]).length?`<div class="small"><b>How EMA handled it:</b> ${r.handling.map(x=>esc((x.carc||'')+' '+(x.adjustment_status||'')+' '+money2(x.adjustments_cents)+' on '+(x.transaction_date||''))).join(' · ')}</div>`:''}
    ${(r.ema||[]).length?`<h3 class="small">ModMed EMA rows for this claim</h3><table class="small"><thead><tr><th>Family</th><th>DOS</th><th>CPT</th><th class="num">Charge</th><th class="num">Paid</th><th class="num">Adj</th><th>Status / handling</th></tr></thead><tbody>${r.ema.slice(0,40).map(e=>`<tr><td>${e.family}${e.activity_type?' · '+e.activity_type:''}</td><td>${e.service_date||''}</td><td>${e.cpt||''}${e.modifiers?'-'+JSON.parse(e.modifiers).join(','):''}</td><td class="num">${money2(e.charges_cents)}</td><td class="num">${money2(e.payments_cents)}</td><td class="num">${money2(e.adjustments_cents)}</td><td>${esc(e.claim_status||'')} ${e.carc?'· '+esc(e.carc):''} ${e.adjustment_status?'· '+esc(e.adjustment_status):''} ${e.denial_category?'· '+esc(e.denial_category):''}</td></tr>`).join('')}</tbody></table>`:'<div class="small muted">No EMA export rows for this claim (annual exports not loaded).</div>'}
    <h3 class="small">Evidence</h3><pre>${esc(JSON.stringify(f.evidence,null,1))}</pre>`;
  d.querySelector('#closeD').onclick=()=>d.classList.remove('open');
  d.querySelectorAll('[data-st]').forEach(b=>b.onclick=async()=>{ await api('/api/findings/'+id+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:b.dataset.st})}); openDetail(id); });
  d.querySelector('#btnAppeal').onclick=async()=>{
    const p = await api('/api/appeal/'+id);
    $('#modalBox').innerHTML = `<div style="display:flex;justify-content:space-between"><h2 style="margin:0">${esc(p.subject)}</h2><button id="closeM">✕</button></div>
      ${p.corrected_claim_instructions?`<div class="panel"><b>Correction instructions</b><div>${esc(p.corrected_claim_instructions)}</div></div>`:''}
      <div class="actions" style="margin-top:8px"><button class="primary" id="copyL">Copy letter</button><button id="copyE">Copy evidence</button><span class="small muted">deadline ${p.deadline||'–'} · payer ${p.payer_contact.phone||''} ${p.payer_contact.url||''}</span></div>
      <pre id="letter">${esc(p.letter)}</pre>
      <b class="small">Attach</b><ul class="small">${p.attachments.map(a=>`<li>${esc(a)}</li>`).join('')}</ul>
      <pre id="evid">${esc(p.evidence)}</pre>`;
    $('#modal').classList.add('open');
    $('#closeM').onclick=()=>$('#modal').classList.remove('open');
    $('#copyL').onclick=()=>navigator.clipboard.writeText(p.letter);
    $('#copyE').onclick=()=>navigator.clipboard.writeText(p.evidence);
  };
}

window.addEventListener('hashchange', ()=>{ const h=location.hash.slice(1); if(TABS.some(t=>t[0]===h) && h!==state.tab){ state.tab=h; render(); } });
(async function(){
  if(location.hash && TABS.some(t=>t[0]===location.hash.slice(1))) state.tab=location.hash.slice(1);
  initNav();
  try { await loadMeta(); } catch(e){ $('#fresh').textContent='no data loaded yet'; }
  render();
})();
