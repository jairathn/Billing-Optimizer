<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RemitWatch</title>
<style>
:root{color-scheme:light;--bg:#f6f7f9;--panel:#ffffff;--ink:#17202a;--muted:#5d6b7a;--line:#e3e7ec;--accent:#1f5fbf;--accent-ink:#fff;--bad:#b42318;--warn:#b54708;--good:#067647;--soft:#eef2f7;--chip:#eaf0fb}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f141a;--panel:#171e26;--ink:#e8edf2;--muted:#9aa7b4;--line:#2a3441;--accent:#6ea2ff;--accent-ink:#0b1220;--bad:#ff7b6b;--warn:#f0a35a;--good:#5fd39b;--soft:#1e2731;--chip:#22304a}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f141a;--panel:#171e26;--ink:#e8edf2;--muted:#9aa7b4;--line:#2a3441;--accent:#6ea2ff;--accent-ink:#0b1220;--bad:#ff7b6b;--warn:#f0a35a;--good:#5fd39b;--soft:#1e2731;--chip:#22304a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:12px 16px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0 16px 0 0}
header .fresh{color:var(--muted);font-size:12px;flex:1 1 240px}
header select,header input,.filters select,.filters input,.lh-tools select,.lh-tools input,.more-f select,.more-f input,#tierSel,button{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);cursor:pointer}
button{cursor:pointer}
nav{display:flex;flex-wrap:wrap;gap:4px;padding:8px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
nav a{padding:6px 10px;border-radius:6px;color:var(--muted);text-decoration:none;cursor:pointer}
nav a.active{background:var(--chip);color:var(--ink);font-weight:600}
main{padding:16px;max-width:1500px;margin:0 auto}
.grid{display:grid;gap:12px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer}
.kpi .v{font-size:22px;font-weight:700;margin-top:4px}
.kpi .l{color:var(--muted);font-size:12px}
.kpi .s{color:var(--muted);font-size:12px;margin-top:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px}
.panel h2{font-size:15px;margin:0 0 8px}
.two{grid-template-columns:1fr 1fr}
@media(max-width:900px){.two{grid-template-columns:1fr}}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;font-size:12px;white-space:nowrap;cursor:pointer}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.row:hover{background:var(--soft);cursor:pointer}
.chip{display:inline-block;padding:1px 7px;border-radius:999px;background:var(--chip);font-size:11px;margin-right:4px;white-space:nowrap}
.chip.hint{background:none;border:1px solid var(--warn);white-space:normal}
.sev-high{color:var(--bad);font-weight:600}.sev-medium{color:var(--warn)}.sev-low,.sev-info{color:var(--muted)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;align-items:center}
.muted{color:var(--muted)}
.note{color:var(--muted);font-size:12px;margin:4px 0 8px}
.pager{display:flex;gap:8px;align-items:center;margin-top:8px;color:var(--muted);font-size:12px}
#drawer{position:fixed;top:0;right:-760px;width:740px;max-width:100vw;height:100vh;background:var(--panel);border-left:1px solid var(--line);box-shadow:-8px 0 24px rgba(0,0,0,.2);overflow:auto;transition:right .2s;z-index:20;padding:16px}
#drawer.open{right:0}
#drawer h2{margin:0 0 6px;font-size:16px}
pre{background:var(--soft);padding:10px;border-radius:8px;overflow:auto;font-size:12px;white-space:pre-wrap}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:30;align-items:center;justify-content:center}
.modal.open{display:flex}
.modal .box{background:var(--panel);width:900px;max-width:96vw;max-height:92vh;overflow:auto;border-radius:10px;padding:16px}
.heat td{text-align:right;font-variant-numeric:tabular-nums}
.bar{height:8px;background:var(--chip);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.actions button{margin-right:6px;margin-bottom:6px}
.legend{font-size:12px;color:var(--muted);columns:2;column-gap:24px}
.legend b{color:var(--ink)}
.chartbox{position:relative;height:320px}
.small{font-size:12px}
td.who{min-width:9.5rem} td.who a.pt{font-weight:600;color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px}
td.who a.pt:hover{text-decoration-color:currentColor} td.day{white-space:nowrap}
.ok{color:var(--good)}
.alert{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:10px 12px;margin:8px 0;background:var(--panel)}
.alert.acknowledged{opacity:.75}.alert.cleared{opacity:.55;border-left-color:var(--muted)}
.alert .ttl{font-weight:600;margin:4px 0}
.alert .row1{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
textarea{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
#bellBtn b{margin-left:4px}
#feedChip{font-size:12px;color:var(--muted)}
td.row{cursor:pointer}
tr.picked{background:var(--chip)}
table.pvt th{white-space:normal;vertical-align:bottom;max-width:150px;cursor:default}
table.pvt td:first-child{white-space:nowrap}
table.pvt th:first-child,table.pvt td:first-child{position:sticky;left:0;background:var(--panel);z-index:1}
table.pvt tr.picked td:first-child{background:var(--chip)}
table.pvt tr.row:hover td:first-child{background:var(--soft)}
table.pvt td .sub{display:block;color:var(--muted);font-size:11px;font-weight:400}
.grid.two > *{min-width:0}
.panel{overflow-x:auto}
tr.row:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.smc > .small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media(max-width:600px){table.pvt td:first-child{white-space:normal;min-width:112px;max-width:42vw}table.pvt td .sub{white-space:normal}}
.filters select{max-width:72vw}
.scroll{overflow:auto}
.busy{opacity:.55;transition:opacity .15s}
.warnbox{border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:8px;padding:8px 12px;margin:8px 0;font-size:12px}
.rng{position:relative;height:10px;min-width:140px;background:var(--soft);border-radius:5px}
.rng i{position:absolute;top:0;height:100%;border-radius:5px;background:var(--pv1,var(--accent));opacity:.55}
.rng b{position:absolute;top:-3px;width:2px;height:16px;margin-left:-1px;background:var(--ink)}
.sm{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.key{display:inline-block;width:14px;height:3px;border-radius:2px;vertical-align:middle}
details summary{cursor:pointer;color:var(--muted)}
/* daily screens: Today, Worklist, Bigger wins, More */
a{color:var(--accent)}
.brand{font-size:18px;font-weight:700;color:var(--ink);text-decoration:none;margin-right:6px}
@media(max-width:700px){#fresh{display:none}}
button.ghost{background:none;border-color:transparent;color:var(--accent)} button.ghost:hover{background:var(--soft)}
button:disabled{opacity:.5;cursor:default}
.page-title{font-size:22px;line-height:1.2;margin:0}
.page-head{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;margin:2px 0 10px}
.today-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:8px 16px;margin:2px 0 12px}
.donebox{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted)} .donebox b{color:var(--ink)}
.banner{border:1px solid var(--line);border-left:4px solid var(--warn);background:var(--panel);border-radius:10px;padding:10px 14px;margin-bottom:12px}
.plan{display:grid;gap:10px}
.step{display:flex;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.step .num{flex:0 0 32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700}
.step.is-done .num{background:var(--good)}
.step .body{flex:1;min-width:0} .step .title{font-weight:650;font-size:15px} .step .line{color:var(--muted);margin-top:2px} .step .chips{margin-top:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.step button{flex:0 0 auto;padding:8px 14px}
@media(max-width:640px){.step{flex-wrap:wrap}.step button{width:100%}}
.kind{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap;background:var(--chip)}
.k-fix{background:rgba(31,95,191,.13);color:#1849a9}.k-auth{background:rgba(105,39,218,.12);color:#6927da}.k-note{background:rgba(14,122,92,.13);color:#0e7a5c}
.k-rule{background:rgba(53,56,205,.12);color:#3538cd}.k-rate{background:rgba(181,71,8,.13);color:#93370d}.k-check{background:rgba(71,84,103,.13);color:#475467}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .k-fix{color:#9ec0ff}:root:not([data-theme="light"]) .k-auth{color:#c7a8ff}:root:not([data-theme="light"]) .k-note{color:#6fdcb6}:root:not([data-theme="light"]) .k-rule{color:#a9b0ff}:root:not([data-theme="light"]) .k-rate{color:#f5b878}:root:not([data-theme="light"]) .k-check{color:#c0c9d4}}
:root[data-theme="dark"] .k-fix{color:#9ec0ff}:root[data-theme="dark"] .k-auth{color:#c7a8ff}:root[data-theme="dark"] .k-note{color:#6fdcb6}:root[data-theme="dark"] .k-rule{color:#a9b0ff}:root[data-theme="dark"] .k-rate{color:#f5b878}:root[data-theme="dark"] .k-check{color:#c0c9d4}
.due-now{color:var(--bad);font-weight:650}.due-soon{color:var(--warn);font-weight:600}
.panel-head{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;margin-bottom:6px}.panel-head h2{margin:0}
.batch{display:grid;grid-template-columns:minmax(0,2.3fr) minmax(0,1fr) minmax(0,1.2fr) minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.batch:last-child{border-bottom:0}
@media(max-width:760px){.batch{grid-template-columns:1fr 1fr}.batch .b-main{grid-column:1/-1}.batch button{grid-column:1/-1}}
.change{display:flex;gap:10px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)} .change > div{flex:1;min-width:0}
.wins-list{margin:4px 0 10px;padding-left:18px} .wins-list li{margin:5px 0}
.guide{background:var(--panel);border:1px solid var(--accent);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.guide-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.guide h2{margin:0;font-size:17px}
.guide .lead{margin:6px 0 8px}.guide .steps{margin:0 0 8px;padding-left:20px}.guide .steps li{margin:5px 0}.guide-more{color:var(--muted);font-size:13px;margin-bottom:10px}
.segs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 4px}
.seg{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:6px 10px;border-radius:8px;text-align:left}
.seg.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--chip)}
.seg .cnt{color:var(--muted);font-size:12px;margin-left:2px}.seg-sub{font-size:11px;color:var(--muted)}
.howbox{background:var(--soft);border-radius:8px;padding:8px 12px;margin:6px 0;font-size:13px}
.wl-bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin:6px 0}
.bulk{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center}.bulk[hidden]{display:none}
table.wl td{vertical-align:middle} table.wl th{cursor:default}
.st{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;background:var(--chip);white-space:nowrap}
.st-in_progress{background:rgba(181,71,8,.13)}.st-appealed{background:rgba(31,95,191,.13)}.st-resolved{background:rgba(14,122,92,.15)}.st-lost,.st-dismissed{background:rgba(71,84,103,.13)}
.empty{padding:24px;text-align:center;color:var(--muted)}
.todo-box{border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:10px;padding:10px 12px;margin:8px 0 10px;background:var(--soft)}
.todo-top{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-bottom:6px}.todo-what,.todo-next{margin:4px 0}
.todo-actions{margin-top:8px}
.calc-row{padding:6px 0;border-bottom:1px dashed var(--line)}
.calc-row label{display:block;font-size:13px}
.calc-ctl{display:flex;align-items:center;gap:8px}
.calc-ctl input[type=range]{flex:1;min-width:0}
.calc-num{width:78px}
h3.calc-h{font-size:13px;margin:12px 0 2px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
table.calc-fall td{padding:7px 8px}
table.calc-fall tr.calc-total td{border-top:2px solid var(--ink)}
.lab-card{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:8px 0}
.lab-card .lab-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap;cursor:pointer}
.lab-impact{margin:4px 0}
.sheet h2{margin-top:0}
@media print{header,nav,#drawer,.no-print,#calcCtl,.panel:not(.sheet){display:none !important} body{background:#fff} .sheet{border:0}}
.more-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.more-card{display:flex;flex-direction:column;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;color:var(--ink);text-decoration:none}
.more-card:hover{border-color:var(--accent)}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}.check:last-child{border-bottom:0}
.check .mark{flex:0 0 22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.check.ok .mark{background:rgba(6,118,71,.15);color:var(--good)}.check.bad .mark{background:rgba(180,35,24,.13);color:var(--bad)}
.missed{margin:14px 2px}
.fchip{display:inline-flex;align-items:center;gap:4px;padding:2px 4px 2px 10px;border-radius:999px;background:var(--chip);font-size:12px}
.fchip button{border:0;background:none;padding:0 6px;color:var(--muted)}
.statusbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.sigchips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.sigchip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;font-size:13px;text-align:left}
.sigchip.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--chip)}
@media(max-width:640px){.sigchips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}.sigchip{flex:0 0 auto}}
#drawer td,#drawer .todo-box{overflow-wrap:break-word}
#drawer td.num,#drawer td.day,#drawer td.code{white-space:nowrap}
#drawer tr.has-item{background:var(--soft)}
.todo-err:empty,.st-err:empty{display:none}
table.wl input.sel,#selAll{width:20px;height:20px}
/* category pages: tiles, what to do, the strip, the list head, the Details fold */
.ph-row{display:flex;flex-wrap:nowrap;justify-content:space-between;align-items:flex-start;gap:12px}.ph-row>div:first-child{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;flex:1;min-width:0}
.ph-go{text-align:right;flex:0 0 auto}
.allopen{margin:-4px 2px 8px}
.why-chips{display:flex;flex-wrap:wrap;gap:6px;padding:4px 4px 8px 18px;align-items:center}

nav a .bdg[hidden]{display:none}
nav .gap{flex:1 1 12px}nav a.ref{font-size:13px}
@media(min-width:641px) and (max-width:1359px){nav a.ref:not([data-tab=more]),nav .gap{display:none}nav a{padding:6px 8px}
  nav[data-cur=progress] a[data-tab=more],nav[data-cur=data] a[data-tab=more],nav[data-cur=providers] a[data-tab=more]{background:var(--chip);color:var(--ink);font-weight:600}}
.mid-only{display:none}@media(min-width:641px) and (max-width:1359px){.mid-only{display:flex}}

.oneline{font-size:12px;color:var(--muted);margin:-4px 0 8px}

.todo-row{display:grid;grid-template-columns:auto minmax(12rem,1fr) auto fit-content(19rem);gap:10px;align-items:center;padding:7px 4px;border-top:1px solid var(--line);cursor:pointer}

<header>
  <a class="brand" href="#today">RemitWatch</a>

  <input id="claimFind" type="search" maxlength="200" placeholder="Find a claim" aria-label="Find a claim by its claim ID or the payer's claim number" title="A claim ID as EMA shows it, or the payer's claim number: opens every remittance for it, line by line">
  <button id="guideBtn" class="ghost" title="What this site does and how to use it">How this works</button>

  <button id="lockBtn" style="display:none" title="forget the owner's password on this page: the Providers tab and lines billed by provider close again">Lock providers</button>
  <button id="themeBtn" title="theme">◐</button>
</header>
<nav id="nav"></nav>
<main id="view"></main>
<div id="drawer"></div>
<div class="modal" id="modal"><div class="box" id="modalBox"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js" integrity="sha512-CQBWl4fJHWbryGE+Pc7UAxWMUMNMWzWxF4SQo9CgkJIN1kx6djDQZjh3Y8SZ1d+6I+1zze6Z7kHXO7q3UyZAWw==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<script>
// Today first, then the billing team's categories, the Worklist and Bigger wins; Progress, Data, Providers and More to the
// right in smaller type. The analysis pages are under More (and open by their address).
const TABS = [['today','Today'],['denials','Denials'],['bundling','Bundling & modifiers'],['downcoding','Downcoding'],['contracts','Contracts & underpayment'],
  ['fees','Fees & takebacks'],['worklist','Worklist'],['wins','Bigger wins'],['progress','Progress'],['data','Data'],['providers','Providers'],['calculator','Calculator'],['more','More']];
const REF_TABS = new Set(['progress','data','providers','calculator','more']);
const CLASSIC = [['overview','Overview'],['alerts','Alerts'],['explorer','Who & what'],['payers','Payers & rates']];
const ALIASES = {appeals:'worklist'};        // the earlier Appeals queue is the Worklist
const NEEDS_SUMMARY = new Set(['overview','explorer','payers']);
const SIGNAL_HELP = {
  DOWNCODE_SVC06:'Payer reported the code you billed (835 SVC06) and paid a lower level.',
  DOWNCODE_VS_BILLED:'The claim file or EMA shows a higher level was billed than the code on the remit, and the payer reported no change.',
  DOWNCODE_LEVEL_REDUCED:'Payment cut for the level of care with the billed code left in place (reason code 186 or 150). This is the pattern that hides inside a normal-looking payment.',
  DOWNCODE_LINE_SWAP:'The billed visit was denied and a lower-level visit line was paid in its place.',
  DENIED_LEVEL_OF_SERVICE:'Reason code 150 or 186 on a procedure: the payer says the records do not support the service as billed. Appeal with the operative note.',
  MPPR_POLICY:'This payer routinely allows third and later same-day procedures below the standard 50 percent. A contract question, not a one-off error.',
  SECOND_RATE:'This payer allowed the same lower amount for this code on several claims, and the remittances point to a reason: the rate for a PA or NP, an office in another state, one plan, the multiple-procedure rule, or a rate change from a date. Ask the payer once about all of them. The claims are listed in the finding, each with its own filing deadline; the date shown is the last of them.',
  DOWNCODE_CHARGE:'Charge amount equals your fee for a higher level than the code the payer paid; the payer did not report the original code.',
  DOWNCODE_RATE:'Allowed amount equals the payer\'s usual rate for a lower level with no code change reported.',
  DOWNCODE_LEVEL_DENIED:'Visit paid $0 with reason code 150/186 or a level-of-service remark: payer says documentation does not support the level.',
  CODE_CHANGED:'Payer changed the procedure code (SVC06) outside the E/M, biopsy, repair and excision level families.',
  EM_BUNDLED_NO_MODIFIER:'E/M paid $0 as included in a same-day procedure and no modifier was billed. Correctable: add 25 if separately identifiable, resubmit.',
  EM_BUNDLED_MOD57_MINOR:'E/M-57 bundled; the same-day procedure has a 0/10-day global, so 57 is the wrong modifier. Correctable: use 25.',
  EM_BUNDLED_MOD57_MAJOR:'E/M-57 bundled although a 90-day global procedure was done. Appeal if the decision for surgery was made at this visit.',
  EM_BUNDLED_MOD25:'E/M-25 bundled into the procedure. Appeal with the note showing a separate, significant problem.',
  EM_BUNDLED_MOD24:'E/M-24 denied inside a global period. Appeal with documentation of the unrelated problem.',
  ADDON_BUNDLED:'Add-on code (17312, 11103, 17003 and similar) paid $0 as bundled. Add-ons are payable with their primary; appeal.',
  PROCEDURE_BUNDLED:'A procedure (Mohs stage, flap, repair) bundled into another same-day service. Appeal with NCCI tables.',
  DENIED_MISSING_MODIFIER:'CO-16 with remark N822/N823: missing or invalid modifier. Correct and resubmit.',
  DENIED_CODING:'Code or modifier combination rejected (CO-4 and similar). Correct and resubmit.',
  DENIED_MISSING_PRIMARY:'Add-on billed without a payable primary (CO-B15). Review the primary line.',
  DENIED_MISSING_INFO:'Claim lacks information (CO-16/226/227/252). Resubmit with what the remark code asks for.',
  DENIED_AUTH:'Authorization missing or exceeded (CO-197/198). Appeal or request retro-authorization; fix the front-end process.',
  DENIED_MEDICAL_NECESSITY:'Medical necessity or documentation (CO-50/B12/A1). Appeal with records.',
  DENIED_FREQUENCY:'Frequency or units (CO-151/119). Appeal with records.',
  DENIED_NONCOVERED:'Non-covered service. Verify benefits; bill the patient where allowed.',
  DENIED_TIMELY_FILING:'Timely filing (CO-29). Lost unless you can prove timely submission.',
  DENIED_PROVIDER:'Provider enrollment or credentialing (CO-B7/170). Fix the enrollment, then reprocess.',
  DENIED_DUPLICATE_UNPAID:'Denied as duplicate, but no remit ever paid this line. Find the original payment or reprocess.',
  DENIED_OTHER:'Paid $0 with another payer-responsibility reason code.',
  CLAIM_DENIED_UNPAID:'Whole claim denied (CLP02=4) and never paid later.',
  UNDERPAID_VS_OWN_RATE:'Allowed below the payer\'s own usual rate for this code and provider type, with no reduction reason reported.',
  MPPR_EXCESS:'Multiple-procedure reduction deeper than policy, or applied to an add-on code.',
  FEE_SKIM:'Payment fees withheld from the remittance (Zelis transaction fees, origination fees). Opt out: demand fee-free standard EFT.',
  TAKEBACK:'Overpayment recovery withheld from a later remittance (PLB WO). Review the reason and the recoupment notice.',
  CONTRACT_RATE_GAP:'Commercial payer\'s usual allowed is far below Medicare for a high-volume code. Renegotiate or reconsider participation.',
  MA_BELOW_MEDICARE:'Medicare Advantage payer\'s usual allowed is below the Medicare fee schedule. Check the contract terms.',
  CHARGE_BELOW_RATE:'Your charge for this code is below what this payer allows, so it paid your charge. Raise the fee for the code; claims billed after that are paid in full. Past claims cannot be appealed.',
  G2211_DENIED:'G2211 denied most of the time by this payer: stop billing it there or appeal under the payer\'s policy.',
  MIPS_ADJUSTMENT:'Net MIPS adjustment on Medicare lines (positive = bonus).',
  SEQUESTRATION:'2 percent federal sequestration withheld on Medicare and MA lines (not recoverable).'
};
const state = {tab:'today', year:'', status:'open', page:{}, filt:{}, summary:null, meta:null, charts:{}};
const HANDLING = {WRITE_OFF:'written off in EMA', TRANSFER_RESPONSIBILITY:'moved to patient in EMA', IGNORE:'ignored in EMA', MIXED:'mixed handling in EMA'};
const $ = s => document.querySelector(s);
const money = c => (c==null?'–':(c<0?'-':'')+'$'+Math.round(Math.abs(c)/100).toLocaleString());
const money2 = c => (c==null?'–':'$'+(c/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}));
const showPhi = () => !!(state.meta && state.meta.show_phi);       // names on screen; false until the site's settings have arrived
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mods = js => { try { const a = JSON.parse(js||'[]'); return Array.isArray(a)&&a.length ? '-'+esc(a.join(',')) : ''; } catch(e){ return ''; } };
async function api(path, opts){ if(opts && opts.method==='POST'){ opts.headers = Object.assign({'X-Requested-With':'remitwatch'}, opts.headers||{}); }
  // what each clinician is doing may be kept for the owner: the password typed into the Providers tab rides along on those calls only
  if(state.ownerKey && /^\/api\/(activity\/|breakdown)/.test(path)){ opts = Object.assign({}, opts||{}); opts.headers = Object.assign({'X-Owner-Password': state.ownerKey}, opts.headers||{}); }
  const r = await fetch(path, opts); if(!r.ok){ let m=''; try{ m=(await r.json()).detail||''; }catch(e){} if(Array.isArray(m)) m = m.map(x=>(x&&x.msg)||'').filter(Boolean).join('; '); const err = new Error(m || ('The server did not answer as expected ('+r.status+').')); err.status = r.status; throw err; } return r.json(); }
function qs(o){ return Object.entries(o).filter(([k,v])=>v!==''&&v!=null).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&'); }
function sweepCharts(){ Object.keys(state.charts).forEach(id=>{ const c=state.charts[id]; if(!c.canvas || !c.canvas.isConnected){ c.destroy(); delete state.charts[id]; } }); }
function chart(id, cfg){ if(state.charts[id]) state.charts[id].destroy(); const el=document.getElementById(id); if(!el) return;
  if(!el.parentElement.classList.contains('chartbox')){ const box=document.createElement('div'); box.className='chartbox'; el.parentElement.insertBefore(box, el); box.appendChild(el); }
  cfg.options = Object.assign({maintainAspectRatio:false}, cfg.options||{});
  state.charts[id]=new Chart(el, cfg); }
const palette = ['#1f5fbf','#d9534f','#f0ad4e','#5cb85c','#7b5ea7','#2aa198','#8c6d1f','#6c757d'];

function tabOpen(k){ return TABS.some(t=>t[0]===k) || CLASSIC.some(t=>t[0]===k) || k in ALIASES; }
function initNav(){
  $('#nav').innerHTML = TABS.map(([k,l])=>`${k==='progress'?'<span class="gap"></span>':''}<a href="#${k}" data-tab="${k}" class="${k===state.tab?'active':''}${REF_TABS.has(k)?' ref':''}">${l}${BADGE_CAT[k]?`<span class="bdg" data-bdg="${k}" hidden></span>`:''}</a>`).join('');
  $('#nav').querySelectorAll('a[data-tab]').forEach(a=>a.onclick=e=>{ e.preventDefault(); if(e.target.closest('.bdg') && typeof badgeOpen === 'function') badgeOpen(a.dataset.tab);
    state.tab=a.dataset.tab; location.hash=state.tab; render();});
  $('#yearSel').onchange = e=>{state.year=e.target.value; render();};
  $('#statusSel').onchange = e=>{state.status=e.target.value; render();};
  $('#lockBtn').onclick = ()=>{ pvForget(); render(); };
  $('#themeBtn').onclick = ()=>{const r=document.documentElement; const dark = r.dataset.theme==='dark' || (r.dataset.theme!=='light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
    r.dataset.theme = dark?'light':'dark'; if(state.tab==='providers'){ if(typeof pvRedraw==='function' && pvRedraw()) return; render(); } };
  $('#modal').onclick = e=>{ if(e.target.id==='modal') $('#modal').classList.remove('open'); };
  $('#bellBtn').onclick = ()=>{ state.tab='alerts'; location.hash='alerts'; render(); };
  $('#feedChip').onclick = ()=>{ state.tab='data'; location.hash='data'; render(); };
  $('#guideBtn').onclick = ()=>openGuide();
  $('#claimFind').onkeydown = e=>{ if(e.key==='Enter'){ e.preventDefault(); findClaim(e.target.value); } };
}
async function loadMeta(){
  state.meta = await api('/api/meta');
  const m = state.meta, r = m.remits||{}, runs = (m.runs||[])[0];
  $('#fresh').textContent = `${(r.n||0).toLocaleString()} remits · payments ${r.first_payment||'?'} to ${r.last_payment||'?'} · last analysis ${runs?runs.finished_at.replace('T',' ').slice(0,16):'never'} · files ${m.files?m.files.n:0}`;
  $('#claimFind').placeholder = showPhi() ? 'Find a claim or patient' : 'Find a claim';
}
async function loadSummary(){
  state.summary = await api('/api/summary?'+qs({year:state.year,status:state.status}));
  const ys = $('#yearSel'); const cur = ys.value;
  ys.innerHTML = '<option value="">All years</option>'+state.summary.years.map(y=>`<option value="${y}">${y}</option>`).join('');
  ys.value = cur;
}
async function render(){
  const run = state.run = (state.run||0) + 1;       // a slower, older run must not draw over a newer one
  if(!state.meta){ try { await loadMeta(); } catch(e){} if(run !== state.run) return; }      // a cold start can fail the first call
  if(ALIASES[state.tab]){ state.tab = ALIASES[state.tab]; history.replaceState(null, '', '#'+state.tab); }
  const classic = CLASSIC.some(t=>t[0]===state.tab);
  $('#nav').dataset.cur = state.tab;            // between 641 and 1,359 px More stands for Progress, Data and Providers
  $('#nav').querySelectorAll('a[data-tab]').forEach(a=>a.classList.toggle('active', a.dataset.tab===state.tab || (classic && a.dataset.tab==='more')));
  const act = $('#nav a.active'); if(act && window.innerWidth <= 640 && act.scrollIntoView) act.scrollIntoView({block:'nearest', inline:'nearest'});
  // the year and status pickers belong to the analysis pages; the daily screens carry their own filters
  ['#yearSel','#statusSel'].forEach(q=>{ $(q).parentElement.style.display = NEEDS_SUMMARY.has(state.tab) ? '' : 'none'; });
  if(!DESKS[state.tab] && state.tab !== 'fees'){ state.worklist = null; state.wlNext = null; state.wlTotal = null; state.wlKey = null; }   // "item 3 of 50" means something on a list page only
  if(NEEDS_SUMMARY.has(state.tab)) await loadSummary();
  if(run !== state.run) return;
  const old = $('#view'), v = old.cloneNode(false);      // an older run still holds the old node and can only write into that
  old.replaceWith(v);
  v.innerHTML = '<div class="muted">loading…</div>'; v.classList.remove('busy');
  const fn = {today: todayTab, denials: x=>deskTab(x,'denials'), bundling: x=>deskTab(x,'bundling'), downcoding: x=>deskTab(x,'downcoding'),
    contracts: x=>deskTab(x,'contracts'), fees: feesDesk, worklist: x=>deskTab(x,'worklist'), wins: winsTab, more: moreTab, overview, payers, data,
    alerts: alertsTab, explorer: explorerTab, progress: progressTab, providers: providersTab, calculator: calculatorTab}[state.tab] || todayTab;
  try { await fn(v); } catch(e){ if(run === state.run){ v.innerHTML = `<div class="panel">Error: ${esc(e.message)}</div>`; } console.error(e); }
  if(run === state.run) sweepCharts();
}
function sumBy(rows, key){ const m={}; rows.forEach(r=>{m[r[key]]=(m[r[key]]||0)+(r.shortfall_cents||0);}); return m; }
function sigRows(sigs){ return state.summary.by_signal.filter(r=>sigs.includes(r.signal)); }
function total(rows){ return rows.reduce((a,r)=>a+(r.shortfall_cents||0),0); }
function count(rows){ return rows.reduce((a,r)=>a+(r.n||0),0); }

// ---------------------------------------------------------------- overview
async function overview(v){
  const s = state.summary, cat = sumBy(s.by_category,'category');
  const appealable = s.by_actionable.find(r=>r.actionable==='appeal')||{}, fix = s.by_actionable.find(r=>r.actionable==='correct_and_resubmit')||{};
  const dl = Object.fromEntries(s.deadlines.map(d=>[d.bucket,d]));
  const hot = (state.alertsNew||[]).filter(a=>a.severity!=='info').slice(0,4);
  v.innerHTML = `${hot.length?`<div class="panel" style="margin-top:0"><h2>New alerts</h2>${hot.map(a=>`<div class="small"><span class="sev-${a.severity}">●</span> ${esc(a.title)}</div>`).join('')}<div class="small"><a id="goAlerts" style="cursor:pointer;color:var(--accent)">Open alerts</a></div></div>`:''}
  <div class="grid kpis">
    ${kpi('Identified leakage', money(total(s.by_category)), 'all categories, '+(state.status==='all'?'all':'open')+' findings', 'overview')}
    ${kpi('Appealable', money(appealable.shortfall_cents), (appealable.n||0).toLocaleString()+' findings', 'appeals')}
    ${kpi('Correctable billing errors', money(fix.shortfall_cents), (fix.n||0).toLocaleString()+' lines to resubmit', 'appeals')}
    ${kpi('Contract gap vs Medicare', money((cat.contract||0) - total(sigRows(['CHARGE_BELOW_RATE']))), 'commercial and MA rates', 'contracts')}
    ${kpi('Bundled away', money(cat.bundling), 'E/M, add-ons, Mohs stages', 'bundling')}
    ${kpi('Denied, never paid', money(cat.denial), 'lines and whole claims', 'denials')}
    ${kpi('Downcoded', money(cat.downcoding), 'code or level reduced', 'downcoding')}
    ${kpi('Fees and takebacks', money(cat.fees), 'PLB withholds', 'fees')}
    ${kpi('Due in 30 days', money((dl.due_30d||{}).shortfall_cents), ((dl.due_30d||{}).n||0)+' appeals · expired '+money((dl.expired||{}).shortfall_cents), 'appeals')}
    ${kpi('Recovered on later remits', money((s.resolved_by_later_remit||{}).shortfall_cents), ((s.resolved_by_later_remit||{}).n||0)+' lines paid after rework (auto-resolved)', 'denials')}
  </div>
  <div class="grid two">
    <div class="panel"><h2>Leakage by month of service</h2><canvas id="cMonth"></canvas></div>
    <div class="panel"><h2>Leakage by payer</h2><canvas id="cPayer"></canvas></div>
  </div>
  <div class="panel"><h2>Signals</h2><div class="note">Click a row to see the findings.</div>
    <table><thead><tr><th>Signal</th><th>Category</th><th>Severity</th><th>Action</th><th class="num">Findings</th><th class="num">Dollars</th><th>What it means</th></tr></thead>
    <tbody>${s.by_signal.filter(r=>r.category!=='info').map(r=>`<tr class="row" data-sig="${r.signal}" data-cat="${r.category}"><td><code>${r.signal}</code></td><td>${r.category}</td><td class="sev-${r.severity}">${r.severity}</td><td>${r.actionable}</td><td class="num">${r.n.toLocaleString()}</td><td class="num">${money(r.shortfall_cents)}</td><td class="small muted">${esc(SIGNAL_HELP[r.signal]||'')}</td></tr>`).join('')}</tbody></table>
  </div>
  <div class="panel"><h2>Context</h2>${s.info.map(r=>`<div class="small">• ${esc(r.title)}</div>`).join('')||'<div class="muted small">No context rows yet.</div>'}</div>`;
  v.querySelectorAll('.kpi').forEach(k=>k.onclick=()=>{state.tab=k.dataset.go; render();});
  if(v.querySelector('#goAlerts')) v.querySelector('#goAlerts').onclick=()=>{state.tab='alerts'; render();};
  v.querySelectorAll('tr.row').forEach(tr=>{ const cat = tr.dataset.cat, sig = tr.dataset.sig;
    if(!['downcoding','bundling','denial','underpayment'].includes(cat)){ tr.classList.remove('row'); return; }   // fees and contract rows count other things
    tr.onclick = () => { state.tab = {downcoding:'downcoding', bundling:'bundling', denial:'denials', underpayment:'contracts'}[cat]; location.hash = state.tab;
      state.filt[state.tab] = {signal: sig, deadline:'', status: state.status || 'open', year: state.year || '', sort:'shortfall'}; render(); }; });
  // charts
  const months = [...new Set(s.by_month.map(r=>r.month))].sort(), cats=['downcoding','bundling','denial','underpayment','fees','contract'];
  chart('cMonth',{type:'bar',data:{labels:months,datasets:cats.map((c,i)=>({label:c,backgroundColor:palette[i],data:months.map(m=>{const r=s.by_month.find(x=>x.month===m&&x.category===c);return r?r.shortfall_cents/100:0;})}))},
    options:{responsive:true,scales:{x:{stacked:true},y:{stacked:true,ticks:{callback:v=>'$'+v.toLocaleString()}}},plugins:{legend:{position:'bottom'}}}});
  const bp = s.by_payer.slice(0,12);
  chart('cPayer',{type:'bar',data:{labels:bp.map(r=>r.payer_group),datasets:[{label:'dollars',backgroundColor:palette[0],data:bp.map(r=>r.shortfall_cents/100)}]},
    options:{indexAxis:'y',responsive:true,scales:{x:{ticks:{callback:v=>'$'+v.toLocaleString()}}},plugins:{legend:{display:false}}}});
}
function kpi(l,v,s,go){ return `<div class="kpi" data-go="${go}"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></div>`; }

// ---------------------------------------------------------------- findings table (shared)
async function findingsTable(v, container, base, opts={}){
  const key = state.tab; const f = Object.assign({signal:'',payer:'',severity:'',actionable:'',q:'',deadline:'',handling:'',patient_of:'',patient_label:''}, state.filt[key]||{});
  const page = state.page[key]||0, limit = 100;
  // an empty filter must not erase the tab's own scope. What was typed in the search box travels in a header, never in the
  // address: with names shown it can be a patient's name, and addresses are what access logs keep.
  const chosen = Object.fromEntries(Object.entries(f).filter(([k,val])=>val!==''&&val!=null&&k!=='q'&&k!=='patient_label'));
  const typed = String(f.q||'').slice(0,200);
  let sent = ''; try { sent = encodeURIComponent(typed); } catch(e){ sent = encodeURIComponent(typed.replace(/[\uD800-\uDFFF]/g,'')); }
  const find = Object.assign({cache:'no-store'}, sent ? {headers:{'X-Search':sent}} : {});
  const params = Object.assign({}, base, chosen, {year:state.year, status:state.status, limit, offset:page*limit, sort: opts.sort||'shortfall'});

async function trendChart(id, params, label){

  chart(id,{type:'line',data:{labels:months,datasets:groups.map((g,i)=>({label:g,borderColor:palette[i],backgroundColor:palette[i],tension:.2,pointRadius:2,data:months.map(m=>{const r=rows.find(x=>x.month===m&&x.grp===g);return r?r.n:0;})}))},

}

      <td>${(adjBy[l.line_key]||[]).map(a=>`<div>${esc(a.group_code)}-${esc(a.reason_code)} ${money2(a.amount_cents)} <span class="muted">${esc(a.text)}</span></div>`).join('')}${(remBy[l.line_key]||[]).map(a=>`<div class="muted">${esc(a.code)} ${esc(a.text)}</div>`).join('')}</td></tr>`).join('')}</tbody></table>
    ${(adjBy.claim||[]).length?`<div class="small">Claim-level: ${adjBy.claim.map(a=>esc(a.group_code)+'-'+esc(a.reason_code)+' '+money2(a.amount_cents)).join(', ')}</div>`:''}
    <h3 class="small">All remits for this claim</h3>
    <table class="small"><thead><tr><th>Paid</th><th>Status</th><th>Payer</th><th class="num">Charge</th><th class="num">Paid</th><th>Trace</th></tr></thead><tbody>${(r.history||[]).map(h=>`<tr><td>${esc(h.payment_date)}</td><td>${esc(h.claim_status_code)}</td><td>${esc(h.payer_name)}</td><td class="num">${money2(h.charge_cents)}</td><td class="num">${money2(h.paid_cents)}</td><td class="small">${esc(h.trace_number)}</td></tr>`).join('')}</tbody></table>
    ${r.link?`<div class="small"><b>EMA charge link:</b> ${esc(r.link.state)}${r.link.ema_cpt?' · billed '+esc(r.link.ema_cpt)+mods(r.link.ema_modifiers)+' x'+esc(r.link.ema_units)+' '+money2(r.link.ema_charges_cents)+' (bill item '+esc(r.link.bill_item_id)+', status '+esc(r.link.ema_claim_status||'')+')':''} ${r.link.cause?'· '+esc(r.link.cause):''}</div>`:''}
    ${(r.handling||[]).length?`<div class="small"><b>How EMA handled it:</b> ${r.handling.map(x=>esc((x.carc||'')+' '+(x.adjustment_status||'')+' '+money2(x.adjustments_cents)+' on '+(x.transaction_date||''))).join(' · ')}</div>`:''}
    ${(r.ema||[]).length?`<h3 class="small">ModMed EMA rows for this claim</h3><table class="small"><thead><tr><th>Family</th><th>DOS</th><th>CPT</th><th class="num">Charge</th><th class="num">Paid</th><th class="num">Adj</th><th>Status / handling</th></tr></thead><tbody>${r.ema.slice(0,40).map(e=>`<tr><td>${esc(e.family)}${e.activity_type?' · '+esc(e.activity_type):''}</td><td>${esc(e.service_date)}</td><td>${esc(e.cpt)}${mods(e.modifiers)}</td><td class="num">${money2(e.charges_cents)}</td><td class="num">${money2(e.payments_cents)}</td><td class="num">${money2(e.adjustments_cents)}</td><td>${esc(e.claim_status||'')} ${e.carc?'· '+esc(e.carc):''} ${e.adjustment_status?'· '+esc(e.adjustment_status):''} ${e.denial_category?'· '+esc(e.denial_category):''}</td></tr>`).join('')}</tbody></table>`:'<div class="small muted">No EMA export rows for this claim (annual exports not loaded).</div>'}`:''}
    </details>
    ${ex.builder ? `<details class="dfold" ${noteWork?'open':''}><summary>Build the appeal from the visit note</summary>${ex.builder}</details>` : ''}
    <details class="dfold"><summary>Technical details</summary><div class="small muted">${esc(f.title)} · ${esc(f.signal)} · ${esc(f.severity)} · ${esc(f.actionable)}${f.stale?' · no longer found by the current rules':''}</div>
    <div class="note">${esc(SIGNAL_HELP[f.signal]||'')}</div><pre>${esc(JSON.stringify(f.evidence,null,1))}</pre></details>`;
  d.querySelector('#closeD').onclick=closeDetail;
  d.querySelector('#closeD').focus({preventScroll:true});
  d.querySelectorAll('[data-st]').forEach(b=>b.onclick=async()=>{
    if(b.dataset.st === 'dismissed' && !confirm('Let go of this item? It leaves the list and counts as let go.')) return;
    try { if(await setFindingStatus(id, b.dataset.st, f.shortfall_cents)){ state.brief = null; state.dirty = true; openDetail(id); } }
    catch(e){ const er = d.querySelector('.st-err'); if(er) er.textContent = 'Not saved: ' + (e.message || 'no answer from the site') + '. Try again.'; } });
  bindWhatToDo(f, d);
  const oc = d.querySelector('#openClaim'); if(oc) oc.onclick = e => { e.preventDefault(); openClaim(r.bill, id); };
  d.querySelectorAll('a.claim-link').forEach(a => a.onclick = e => { e.preventDefault(); openClaim(a.dataset.claim, id); });
  bindDrawerExtras(id, d);
  if(d.querySelector('#btnAppeal')) d.querySelector('#btnAppeal').onclick=async()=>{
    const p = await api('/api/appeal/'+id);
    $('#modalBox').innerHTML = `<div style="display:flex;justify-content:space-between"><h2 style="margin:0">${esc(p.subject)}</h2><button id="closeM">✕</button></div>
      ${p.corrected_claim_instructions?`<div class="panel"><b>Correction instructions</b><div>${esc(p.corrected_claim_instructions)}</div></div>`:''}
      <div class="actions" style="margin-top:8px"><button class="primary" id="copyL">Copy letter</button><button id="copyE">Copy evidence</button><span class="small muted">file by ${esc(p.deadline||'–')} · payer ${esc(p.payer_contact.phone)} ${esc(p.payer_contact.url)}</span></div>
      <div class="note">${esc(p.deadline_basis||'')} To have the clinical paragraphs written from the chart, close this and use "Build the appeal from the visit note" in the finding panel.</div>
      <pre id="letter">${esc(p.letter)}</pre>
      <b class="small">Attach</b><ul class="small">${p.attachments.map(a=>`<li>${esc(a)}</li>`).join('')}</ul>
      <pre id="evid">${esc(p.evidence)}</pre>`;
    $('#modal').classList.add('open');
    $('#closeM').onclick=()=>$('#modal').classList.remove('open');
    $('#copyL').onclick=()=>navigator.clipboard.writeText(p.letter);
    $('#copyE').onclick=()=>navigator.clipboard.writeText(p.evidence);
  };
}

window.addEventListener('hashchange', ()=>{ const h=location.hash.slice(1); if(tabOpen(h) && h!==state.tab){ state.tab=h; render(); } });
// Leaving the page locks what the owner's password opened. A browser may keep the page as it was and bring it back
// on Back: it must come back locked, with nothing left on it.
window.addEventListener('pagehide', ()=>{ if(state.ownerKey || (state.pv && state.pv.data)){ pvForget(); const v=$('#view'); if(v) v.innerHTML=''; sweepCharts(); } });
window.addEventListener('pageshow', e=>{ if(e.persisted) render(); });
(async function(){
  if(location.hash && tabOpen(location.hash.slice(1))) state.tab=location.hash.slice(1);
  initNav();
  try { await loadMeta(); } catch(e){ if(!state.meta) $('#fresh').textContent='no data loaded yet'; }
  brief().catch(()=>{});        // the 7-day badges on the category tabs
  await refreshHeader();
  if(!state.run) render();       // a click while the first answer was slow has drawn the page already
  setInterval(async()=>{ try { await loadMeta(); await refreshHeader(); } catch(e){} }, 120000);
})();
</script>
</body>
</html>
