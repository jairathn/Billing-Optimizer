<script>
// The app's routes (the sidebar, static/shell.js, draws the places): Today, Work's views (the category pages and the
// Worklist), Faxes, Bigger wins, Results and the rest. The keys are the addresses (#today, #denials ...) and never change.
const TABS = [['today','Today'],['denials','Denials'],['bundling','Bundling & modifiers'],['downcoding','Downcoding'],['contracts','Contracts & underpayment'],
  ['fees','Fees & takebacks'],['worklist','Worklist'],['faxes','Faxes'],['wins','Bigger wins'],['results','Results'],['progress','Progress'],['data','Data'],['providers','Providers'],['calculator','Calculator'],['more','More']];
// pages opened by their address or from More, not from the main row; the owner's write-off policy table is one (static/policy.js)
const CLASSIC = [['overview','Overview'],['alerts','Alerts'],['explorer','Who & what'],['payers','Payers & rates'],['policy','Write-off policy']];
const ALIASES = {appeals:'worklist'};        // the earlier Appeals queue is the Worklist
const NEEDS_SUMMARY = new Set(['overview','explorer','payers']);
const SIGNAL_HELP = {
  DOWNCODE_SVC06:'Payer reported the code you billed (835 SVC06) and paid a lower level.',
  DOWNCODE_VS_BILLED:'The claim file or EMA shows a higher level was billed than the code on the remit, and the payer reported no change.',
  DOWNCODE_LEVEL_REDUCED:'Payment cut for the level of care with the billed code left in place (reason code 186 or 150). This is the pattern that hides inside a normal-looking payment.',
  DOWNCODE_LINE_SWAP:'The billed visit was denied and a lower-level visit line was paid in its place.',
  DENIED_LEVEL_OF_SERVICE:'Reason code 150 or 186 on a procedure: the payer says the records do not support the service as billed. Appeal with the operative note.',
  MPPR_POLICY:'This payer routinely allows third and later same-day procedures below the standard 50 percent. A contract question, not a one-off error.',
  SECOND_RATE:'This payer allowed the same lower amount for this code on several claims. Where the remittances point to a reason (the rate for a PA or NP, an office in another state, one plan, the multiple-procedure rule, or a rate change from a date) it is shown; where none shows, check the contract first. Ask the payer once about all of them. The claims are listed in the finding, each with its own filing deadline; the date shown is the last of them.',
  DOWNCODE_CHARGE:'Charge amount equals your fee for a higher level than the code the payer paid; the payer did not report the original code.',
  DOWNCODE_RATE:'Allowed amount equals the payer\'s usual rate for a lower level with no code change reported.',
  DOWNCODE_LEVEL_DENIED:'Visit paid $0 with reason code 150/186 or a level-of-service remark: payer says documentation does not support the level.',
  CODE_CHANGED:'Payer changed the procedure code (SVC06) outside the E/M, biopsy, repair and excision level families.',
  EM_BUNDLED_NO_MODIFIER:'E/M paid $0 as included in a same-day procedure and no modifier was billed. Correctable: add 25 if separately identifiable, resubmit.',
  EM_BUNDLED_MOD57_MINOR:'E/M-57 bundled; the same-day procedure has a 0/10-day global, so 57 is the wrong modifier. Correctable: use 25.',
  EM_BUNDLED_MOD57_MAJOR:'E/M-57 bundled although a 90-day global procedure was done. Appeal if the decision for surgery was made at this visit.',
  EM_BUNDLED_MOD25:'E/M-25 bundled into the procedure. Appeal with the note showing a separate, significant problem.',
  EM_BUNDLED_MOD24:'E/M-24 denied inside a global period. Appeal with documentation of the unrelated problem.',
  ADDON_BUNDLED:'Add-on code (17312, 11103, 17003 and similar) paid $0 as bundled. Add-ons are payable with their primary; appeal.',
  PROCEDURE_BUNDLED:'A procedure (Mohs stage, flap, repair) bundled into another same-day service. Appeal with NCCI tables.',
  DENIED_MISSING_MODIFIER:'CO-16 with remark N822/N823: missing or invalid modifier. Correct and resubmit.',
  DENIED_CODING:'Code or modifier combination rejected (CO-4 and similar). Correct and resubmit.',
  DENIED_MISSING_PRIMARY:'Add-on billed without a payable primary (CO-B15). Review the primary line.',
  DENIED_MISSING_INFO:'Claim lacks information (CO-16/226/227/252). Resubmit with what the remark code asks for.',
  DENIED_AUTH:'Authorization missing or exceeded (CO-197/198). Appeal or request retro-authorization; fix the front-end process.',
  DENIED_MEDICAL_NECESSITY:'Medical necessity or documentation (CO-50/B12/A1). Appeal with records.',
  DENIED_FREQUENCY:'Frequency or units (CO-151/119). Appeal with records.',
  DENIED_NONCOVERED:'Non-covered service. Verify benefits; bill the patient where allowed.',
  DENIED_TIMELY_FILING:'Timely filing (CO-29). Lost unless you can prove timely submission.',
  DENIED_PROVIDER:'Provider enrollment or credentialing (CO-B7/170). Fix the enrollment, then reprocess.',
  DENIED_DUPLICATE_UNPAID:'Denied as duplicate, but no remit ever paid this line. Find the original payment or reprocess.',
  DENIED_OTHER:'Paid $0 with another payer-responsibility reason code.',
  CLAIM_DENIED_UNPAID:'Whole claim denied (CLP02=4) and never paid later.',
  NO_ANSWER:'EMA shows the claim sent and unpaid, and no remittance answers it. Look it up on the payer\'s portal or call. If the payer has no record of it, send it again by the first-filing limit that the item\'s filing window gives.',
  REJECTED_PRE_PAYER:'EMA shows the claim rejected before it reached the payer (at the clearinghouse), or still waiting in its print batch, never sent. Correct it in EMA, or print it, and send it before the filing date shown.',
  UNDERPAID_VS_OWN_RATE:'Allowed below the payer\'s own usual rate for this code and provider type, with no reduction reason reported.',
  MPPR_EXCESS:'Multiple-procedure reduction deeper than policy, or applied to an add-on code.',
  FEE_SKIM:'Payment fees withheld from the remittance (Zelis transaction fees, origination fees). Opt out: demand fee-free standard EFT.',
  TAKEBACK:'Overpayment recovery withheld from a later remittance (PLB WO). Review the reason and the recoupment notice.',
  PROVIDER_RATE_GAP:'This payer pays one clinician at a level of the clinician\'s own, below its usual rate for the code, on many claims, and no rule explains it (it is not the rate for a PA or NP, or the multiple-procedure rule). Check the clinician\'s credentialing and the contract; if the payer is wrong, one request can fix every claim listed that is still inside its filing window.',
  OLD_FEE_SCHEDULE:'This payer paid services dated after its new rates took effect at the amounts of its earlier fee schedule (it loaded the new rates late and did not reprocess them). Each is owed the new rate. Send the payer one repricing request listing every claim; each claim keeps its own filing window, and the date shown is the last of them.',
  CONTRACT_RATE_GAP:'Commercial payer\'s usual allowed is far below Medicare for a high-volume code. Renegotiate or reconsider participation.',
  MA_BELOW_MEDICARE:'Medicare Advantage payer\'s usual allowed is below the Medicare fee schedule. Check the contract terms.',
  CHARGE_BELOW_RATE:'Your charge for this code is below what this payer allows, so it paid your charge. Raise the fee for the code; claims billed after that are paid in full. Past claims cannot be appealed.',
  G2211_DENIED:'G2211 denied most of the time by this payer: stop billing it there or appeal under the payer\'s policy.',
  MIPS_ADJUSTMENT:'Net MIPS adjustment on Medicare lines (positive = bonus).',
  SEQUESTRATION:'2 percent federal sequestration withheld on Medicare and MA lines (not recoverable).'
};
const state = {tab:'today', year:'', status:'open', page:{}, filt:{}, summary:null, meta:null, charts:{}};
const HANDLING = {WRITE_OFF:'written off in EMA', TRANSFER_RESPONSIBILITY:'moved to patient in EMA', IGNORE:'ignored in EMA', MIXED:'mixed handling in EMA'};
const $ = s => document.querySelector(s);
const money = c => (c==null?'–':(c<0?'-':'')+'$'+Math.round(Math.abs(c)/100).toLocaleString());
const money2 = c => (c==null?'–':'$'+(c/100).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2}));
const showPhi = () => !!(state.meta && state.meta.show_phi);       // names on screen; false until the site's settings have arrived
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const mods = js => { try { const a = JSON.parse(js||'[]'); return Array.isArray(a)&&a.length ? '-'+esc(a.join(',')) : ''; } catch(e){ return ''; } };
async function api(path, opts){ if(opts && opts.method==='POST'){ opts.headers = Object.assign({'X-Requested-With':'remitwatch'}, opts.headers||{}); }
  // what each clinician is doing may be kept for the owner: the password typed into the Providers tab rides along on those calls only
  if(state.ownerKey && /^\/api\/(activity\/|breakdown|lessons)/.test(path)){ opts = Object.assign({}, opts||{}); opts.headers = Object.assign({'X-Owner-Password': state.ownerKey}, opts.headers||{}); }
  const r = await fetch(path, opts); if(!r.ok){ let m='', b=null; try{ b=await r.json(); m=(b&&b.detail)||''; }catch(e){} if(Array.isArray(m)) m = m.map(x=>(x&&x.msg)||'').filter(Boolean).join('; '); if(typeof m !== 'string') m = '';
    const err = new Error(m || ('The server did not answer as expected ('+r.status+').')); err.status = r.status; err.code = b && b.code; err.body = b; throw err; } return r.json(); }
// a short line at the foot of the page saying what finished, when the panel has moved on to another item since it started
function notice(text){ let n = document.getElementById('rwNotice'); if(!n){ n = document.createElement('div'); n.id = 'rwNotice'; n.setAttribute('role','status'); n.setAttribute('aria-live','polite'); document.body.appendChild(n); }
  const line = document.createElement('div'); line.textContent = text; n.appendChild(line); setTimeout(()=>line.remove(), 9000); }
function qs(o){ return Object.entries(o).filter(([k,v])=>v!==''&&v!=null).map(([k,v])=>k+'='+encodeURIComponent(v)).join('&'); }
function sweepCharts(){ Object.keys(state.charts).forEach(id=>{ const c=state.charts[id]; if(!c.canvas || !c.canvas.isConnected){ c.destroy(); delete state.charts[id]; } }); }
function chart(id, cfg){ if(state.charts[id]) state.charts[id].destroy(); const el=document.getElementById(id); if(!el) return;
  if(!el.parentElement.classList.contains('chartbox')){ const box=document.createElement('div'); box.className='chartbox'; el.parentElement.insertBefore(box, el); box.appendChild(el); }
  cfg.options = Object.assign({maintainAspectRatio:false}, cfg.options||{});
  state.charts[id]=new Chart(el, cfg); }
const palette = ['#1f5fbf','#d9534f','#f0ad4e','#5cb85c','#7b5ea7','#2aa198','#8c6d1f','#6c757d'];

const own = (o, k) => Object.prototype.hasOwnProperty.call(o, k);       // never a name every object has (constructor, __proto__, toString)
function tabOpen(k){ return TABS.some(t=>t[0]===k) || CLASSIC.some(t=>t[0]===k) || own(ALIASES, k); }
function initNav(){
  // the shell: the sidebar, the phone's tab bar, Help, the theme, Search and go to (static/shell.js)
  RWShell.mount({page: 'app', link: '#', go: tab => { state.tab = tab; location.hash = tab; render(); }, find: text => findClaim(text),
    onTheme: () => { if(state.tab === 'providers'){ if(typeof pvRedraw === 'function' && pvRedraw()) return; render(); } }});
  document.querySelectorAll('#nav a[data-tab], #tabbar a[data-tab]').forEach(a=>a.onclick=e=>{ e.preventDefault(); if(e.target.closest('.bdg') && typeof badgeOpen === 'function') badgeOpen(a.dataset.tab);
    state.tab=a.dataset.tab; location.hash=state.tab; render();});
  $('#yearSel').onchange = e=>{state.year=e.target.value; render();};
  $('#statusSel').onchange = e=>{state.status=e.target.value; render();};
  $('#lockBtn').onclick = ()=>{ pvForget(); render(); };
  $('#modal').onclick = e=>{ if(e.target.id==='modal') $('#modal').classList.remove('open'); };
  $('#bellBtn').onclick = ()=>{ state.tab='alerts'; location.hash='alerts'; render(); };
  $('#health').onclick = e=>{ e.preventDefault(); const anchor = e.currentTarget.dataset.anchor || null;
    if(typeof tdGoData === 'function') tdGoData(anchor); else { state.tab='data'; location.hash='data'; render(); } };
  $('#guideBtn').onclick = ()=>openGuide();
  $('#keysBtn').onclick = ()=>keysSheet();
  $('#claimFind').onkeydown = e=>{ if(e.key==='Enter'){ e.preventDefault(); findClaim(e.target.value); } };
}
// The header's pill and bell, the sidebar's counts and the page's title, from what this page has heard (static/shell.js)
function shellHeader(){
  RWShell.update({meta: state.meta, sync: state.sync, blind: state.blind, alerts: state.alertsNew, brief: state.brief, exports: state.exports,
    freshening: !!state.freshening, metaFailed: !state.meta && !!state.metaFailed});
}
// What the pill needs on every page, asked at most once in ten minutes: what the app cannot see (shared with blindBar)
// and the EMA exports' ages. Both change with a run or an upload only.
async function shellFeeds(){
  const tasks = [];
  if(Date.now() - (state.blindAt||0) > 600000){ state.blindAt = Date.now();
    tasks.push(api('/api/ema/blind').then(x => { state.blind = x; }, () => { state.blindAt = 0; })); }
  if(Date.now() - (state.exportsAt||0) > 600000){ state.exportsAt = Date.now();
    tasks.push(api('/api/ema/exports').then(x => { state.exports = x; }, () => { state.exportsAt = 0; })); }
  await Promise.all(tasks);
  shellHeader();
}
async function loadMeta(){
  state.meta = await api('/api/meta');
  const m = state.meta;      // the remittance and file counts and the runs are on the Data tab; the header says what matters (shellHeader)
  $('#claimFind').placeholder = showPhi() ? 'Find a claim or patient' : 'Find a claim';
  $('#uploadLink').hidden = !(m.uploads || m.report_uploads);     // visit notes by hand on a server; EMA's reports on both hosts
  scBar();                                                         // safe mode said as soon as the site's settings say it
  shellHeader();
}
async function loadSummary(){
  state.summary = await api('/api/summary?'+qs({year:state.year,status:state.status}));
  const ys = $('#yearSel'); const cur = ys.value;
  ys.innerHTML = '<option value="">All years</option>'+state.summary.years.map(y=>`<option value="${y}">${y}</option>`).join('');
  ys.value = cur;
}
async function render(){
  const run = state.run = (state.run||0) + 1;       // a slower, older run must not draw over a newer one
  if(!state.meta){ try { await loadMeta(); } catch(e){} if(run !== state.run) return; }      // a cold start can fail the first call
  if(own(ALIASES, state.tab)){ state.tab = ALIASES[state.tab]; history.replaceState(null, '', '#'+state.tab); }
  if(!tabOpen(state.tab)) state.tab = 'today';
  $('#nav').dataset.cur = state.tab;
  RWShell.setActive(state.tab);                 // the place marked in the sidebar and the tab bar, the page's title
  scBar();                                       // safe mode, above everything on every page (the self-check's banner)
  blindBar();                                    // the blind-spot banner on every page; Today and Data draw their own
  // the year and status pickers belong to the analysis pages; the daily screens carry their own filters
  ['#yearSel','#statusSel'].forEach(q=>{ $(q).parentElement.hidden = !NEEDS_SUMMARY.has(state.tab); });
  if(!own(DESKS, state.tab) && state.tab !== 'fees'){ state.worklist = null; state.wlNext = null; state.wlTotal = null; state.wlKey = null; }   // "item 3 of 50" means something on a list page only
  if(NEEDS_SUMMARY.has(state.tab)) await loadSummary();
  if(run !== state.run) return;
  const old = $('#view'), v = old.cloneNode(false);      // an older run still holds the old node and can only write into that
  old.replaceWith(v);
  v.innerHTML = '<div class="muted">loading…</div>'; v.classList.remove('busy');
  // Results (static/results.js), the Data tab (static/data.js, the page's own data(v) until then) and the write-off policy
  // table (static/policy.js) come from their own scripts: a page whose script is not on this site says so instead
  const pages = {today: todayTab, denials: x=>deskTab(x,'denials'), bundling: x=>deskTab(x,'bundling'), downcoding: x=>deskTab(x,'downcoding'),
    contracts: x=>deskTab(x,'contracts'), fees: feesDesk, worklist: x=>deskTab(x,'worklist'), faxes: faxesTab, wins: winsTab, more: moreTab, overview, payers,
    data: (typeof dataTab === 'function' ? dataTab : data), results: (typeof resultsTab === 'function' ? resultsTab : notHere('Results')),
    policy: (typeof policyTab === 'function' ? policyTab : notHere('Write-off policy')),
    alerts: alertsTab, explorer: explorerTab, progress: progressTab, providers: providersTab, calculator: calculatorTab};
  const fn = own(pages, state.tab) ? pages[state.tab] : todayTab;
  try { await fn(v); } catch(e){ if(run === state.run){ v.innerHTML = `<div class="panel">Error: ${esc(e.message)}</div>`; } console.error(e); }
  if(run === state.run) sweepCharts();
}
// Safe mode (the self-check held its last run: the worklist is the one from before it) above everything on every page, from
// /api/meta's banner (selfcheck.banner). What the app cannot see, the banner's other part, is the blind-spot bar below it.
function scBar(){
  const el = $('#scBar'); if(!el) return;
  const b = (state.meta || {}).banner, safe = b && (b.safe_mode || (b.level === 'safe_mode' ? b.text : ''));
  el.innerHTML = safe ? `<div class="banner" role="status"><b>${esc(safe)}</b> <a href="#data" class="go-data">The Data tab says why (Running on its own)</a></div>` : '';
  const go = el.querySelector('.go-data'); if(go) go.onclick = e => { e.preventDefault(); state.tab = 'data'; location.hash = 'data'; render(); };
}
// The blind-spot banner (today.js tdBlindBanner, GET /api/ema/blind) under the tabs of every page but Today and the Data tab,
// which draw their own, so it shows on every page and never twice. Asked once in ten minutes: it changes with a run only.
async function blindBar(){
  const el = $('#blindBar'), own = () => ['today','data'].includes(state.tab);
  if(!el || typeof tdBlindBanner !== 'function') return;
  if(own()){ el.innerHTML = ''; return; }
  if(state.blind === undefined || Date.now() - (state.blindAt||0) > 600000){
    state.blindAt = Date.now();
    try { state.blind = await api('/api/ema/blind'); } catch(e){ state.blind = null; state.blindAt = 0; }   // a failed ask (a cold start) is asked again on the next page
  }
  if(own()){ el.innerHTML = ''; return; }        // the page changed to Today or Data while it was asked
  await tdBlindBanner(el, state.blind);
}
function notHere(title){ return async v => { v.innerHTML = `<div class="panel"><h2>${esc(title)}</h2><div class="note">This page is not on this site yet. Reload in a few minutes; if it stays like this, the site needs its next update.</div></div>`; }; }
function sumBy(rows, key){ const m={}; rows.forEach(r=>{m[r[key]]=(m[r[key]]||0)+(r.shortfall_cents||0);}); return m; }
function sigRows(sigs){ return state.summary.by_signal.filter(r=>sigs.includes(r.signal)); }
function total(rows){ return rows.reduce((a,r)=>a+(r.shortfall_cents||0),0); }
function count(rows){ return rows.reduce((a,r)=>a+(r.n||0),0); }

// ---------------------------------------------------------------- overview
async function overview(v){
  const s = state.summary, cat = sumBy(s.by_category,'category');
  const appealable = s.by_actionable.find(r=>r.actionable==='appeal')||{}, fix = s.by_actionable.find(r=>r.actionable==='correct_and_resubmit')||{};
  const dl = Object.fromEntries(s.deadlines.map(d=>[d.bucket,d]));
  const hot = (state.alertsNew||[]).filter(a=>a.severity!=='info').slice(0,4);
  v.innerHTML = `${hot.length?`<div class="panel" style="margin-top:0"><h2>New alerts</h2>${hot.map(a=>`<div class="small"><span class="sev-${a.severity}">●</span> ${esc(a.title)}</div>`).join('')}<div class="small"><a id="goAlerts" href="#alerts">Open alerts</a></div></div>`:''}
  <div class="grid kpis">
    ${kpi('Identified leakage', money(total(s.by_category)), 'all categories, '+(state.status==='all'?'all':'open')+' findings', 'overview')}
    ${kpi('Appealable', money(appealable.shortfall_cents), (appealable.n||0).toLocaleString()+' findings', 'appeals')}
    ${kpi('Correctable billing errors', money(fix.shortfall_cents), (fix.n||0).toLocaleString()+' lines to resubmit', 'appeals')}

async function findingsTable(v, container, base, opts={}){
  const key = state.tab; const f = Object.assign({signal:'',payer:'',severity:'',actionable:'',q:'',deadline:'',handling:'',patient_of:'',patient_label:''}, state.filt[key]||{});
  const page = state.page[key]||0, limit = 100;
  // an empty filter must not erase the tab's own scope. What was typed in the search box travels in a header, never in the
  // address: with names shown it can be a patient's name, and addresses are what access logs keep.
  const chosen = Object.fromEntries(Object.entries(f).filter(([k,val])=>val!==''&&val!=null&&k!=='q'&&k!=='patient_label'));
  const typed = String(f.q||'').slice(0,200);
  let sent = ''; try { sent = encodeURIComponent(typed); } catch(e){ sent = encodeURIComponent(typed.replace(/[\uD800-\uDFFF]/g,'')); }
  const find = Object.assign({cache:'no-store'}, sent ? {headers:{'X-Search':sent}} : {});
  const params = Object.assign({}, base, chosen, {year:state.year, status:state.status, limit, offset:page*limit, sort: opts.sort||'shortfall'});
  const res = await api('/api/findings?'+qs(params), find);
  const sigs = base.signal ? base.signal.split(',') : state.summary.by_signal.filter(r=>!base.category||base.category.split(',').includes(r.category)).map(r=>r.signal);
  const payers = state.summary.by_payer.map(r=>r.payer_group);
  // the newest remittance's age in days to the practice's day (today.js daysUntil, from the brief), as the server counts
  // days behind: never the browser's clock against midnight UTC, a day ahead of a US practice each evening
  const last = ((state.meta||{}).remits||{}).last_payment, behind = last ? -daysUntil(last) : null;
  container.innerHTML = `${behind!=null && behind > 10 && !opts.noStale ? `<div class="warnbox"><b>Payments after ${esc(last)} are not in the files yet.</b> The newest remittance in the Dropbox folder is ${behind} days old, so anything paid since then, including corrected claims, still shows here as open. Someone needs to put the latest TriZetto downloads in the folder.</div>` : ''}
    <div class="filters">
      <select data-f="signal"><option value="">All signals</option>${sigs.map(x=>`<option ${f.signal===x?'selected':''}>${x}</option>`).join('')}</select>
      <select data-f="payer"><option value="">All payers</option>${payers.map(x=>`<option ${f.payer===x?'selected':''}>${esc(x)}</option>`).join('')}</select>
      <select data-f="severity"><option value="">Any severity</option>${['high','medium','low'].map(x=>`<option ${f.severity===x?'selected':''}>${x}</option>`).join('')}</select>
      <select data-f="actionable"><option value="">Any action</option>${['appeal','correct_and_resubmit','review','opt_out','renegotiate','raise_fee'].map(x=>`<option ${f.actionable===x?'selected':''}>${x}</option>`).join('')}</select>
      <select data-f="deadline"><option value="">Any deadline</option><option value="valid" ${f.deadline==='valid'?'selected':''}>Still appealable</option><option value="due" ${f.deadline==='due'?'selected':''}>Due in 45 days</option><option value="expired" ${f.deadline==='expired'?'selected':''}>Expired</option></select>
      <select data-f="handling"><option value="">Any EMA handling</option>${Object.keys(HANDLING).map(x=>`<option value="${x}" ${f.handling===x?'selected':''}>${HANDLING[x]}</option>`).join('')}</select>
      <input data-f="q" maxlength="200" placeholder="${showPhi()?'patient name, member ID, claim ID, code…':'claim ID, code, CARC…'}" value="${esc(f.q)}" ${showPhi()?'style="min-width:20rem"':''}>
      ${f.patient_of?`<span class="chip">Only ${esc(f.patient_label||'this patient')} <button class="small ptClear" title="Show all patients" aria-label="Show all patients" style="padding:0 6px;margin-left:4px">✕</button></span>`:''}
      <span class="muted small">${res.total.toLocaleString()} findings · ${money(res.shortfall_cents)}</span>
      <button class="small csvBtn">Export CSV</button>
      ${opts.bulk?'<button id="bulkAppealed" class="small">Mark selected appealed</button>':''}
    </div>
    <table><thead><tr>${opts.bulk?'<th></th>':''}<th>DOS</th><th>Patient</th><th>Payer</th><th>Provider</th><th>Code</th><th>Finding</th><th class="num">Charge</th><th class="num">Allowed</th><th class="num">Expected</th><th class="num">Shortfall</th><th>CARC/RARC</th><th>Deadline</th><th>Status</th></tr></thead>
    <tbody>${res.items.map(r=>`<tr class="row" tabindex="0" data-id="${esc(r.finding_id)}" data-status="${esc(r.status||'open')}">${opts.bulk?`<td><input type="checkbox" class="sel" value="${esc(r.finding_id)}" onclick="event.stopPropagation()"></td>`:''}
      <td class="day">${esc(r.service_date)}</td>
      <td class="who">${showPhi()&&r.patient&&r.claim_key?`<a href="#" class="pt" data-claim="${esc(r.claim_key)}" data-label="${esc(r.patient+(r.member_id?' · '+r.member_id:''))}" title="Everything in this list for this patient (same name and member number)">${esc(r.patient)}</a>`:esc(r.patient||'')}<div class="small muted">${r.patient_control_number?'claim '+esc(r.patient_control_number):''}${r.member_id?'<br>member '+esc(r.member_id):''}</div></td>
      <td>${esc(r.payer_group)}</td><td class="small">${esc((r.rendering_provider_name||'').replace(/\s+/g,' ').trim())}</td>
      <td>${esc(r.original_procedure_code?r.original_procedure_code+'→':'')}${esc(r.procedure_code||'')}${r.modifiers?'-'+esc(r.modifiers):''}</td>
      <td><span class="sev-${esc(r.severity)}">●</span> ${esc(r.title)}<div class="small muted">${r.stale?'<span class="chip">stale</span>':''} ${r.hint?'<span class="chip hint">'+esc(r.hint)+'</span>':''} ${r.ema_handling?'<span class="chip">'+esc(HANDLING[r.ema_handling]||r.ema_handling)+'</span>':''}</div></td>
      <td class="num">${money2(r.charge_cents)}</td><td class="num">${money2(r.allowed_cents)}</td><td class="num">${money2(r.expected_cents)}</td><td class="num"><b>${money2(r.shortfall_cents)}</b></td>
      <td class="small">${esc(r.carc||'')}${r.rarc?'<br>'+esc(r.rarc):''}</td><td class="small day ${r.appeal_deadline&&r.appeal_deadline<(typeof siteDay==='function'?siteDay():new Date().toISOString().slice(0,10))?'sev-high':''}">${esc(r.appeal_deadline)}</td><td><span class="chip">${esc(r.status)}</span></td></tr>`).join('')}</tbody></table>
    <div class="pager"><button class="prev" ${page===0?'disabled':''}>‹ prev</button><span>page ${page+1} of ${Math.max(1,Math.ceil(res.total/limit))}</span><button class="next" ${(page+1)*limit>=res.total?'disabled':''}>next ›</button></div>`;
  container.querySelectorAll('[data-f]').forEach(el=>el.onchange=()=>{ state.filt[key]=Object.assign({}, f, {[el.dataset.f]:el.value}); state.page[key]=0; render(); });
  container.querySelector('.prev').onclick=()=>{state.page[key]=page-1; render();};
  container.querySelector('.next').onclick=()=>{state.page[key]=page+1; render();};
  container.querySelectorAll('tr.row').forEach(tr=>{ tr.onclick=()=>openDetail(tr.dataset.id);
    tr.onkeydown=e=>{ if((e.key==='Enter'||e.key===' ') && e.target===tr){ e.preventDefault(); openDetail(tr.dataset.id); } }; });
  // a name lists that patient only: the same name and member number exactly, asked for by the claim, so that neither travels in the address
  container.querySelectorAll('a.pt').forEach(a=>a.onclick=e=>{ e.preventDefault(); e.stopPropagation(); state.filt[key]=Object.assign({}, f, {patient_of:a.dataset.claim, patient_label:a.dataset.label}); state.page[key]=0; state.focusPt=true; render(); });
  const pc = container.querySelector('.ptClear');
  if(pc){ pc.onclick=()=>{ state.filt[key]=Object.assign({}, f, {patient_of:'', patient_label:''}); state.page[key]=0; state.focusQ=true; render(); }; if(state.focusPt) pc.focus(); }
  if(state.focusQ){ const box = container.querySelector('[data-f="q"]'); if(box) box.focus(); }
  state.focusPt=false; state.focusQ=false;
  container.querySelector('.csvBtn').onclick=async()=>{      // fetched, not linked, for the same reason the search text is not in the address
    let r;
    try { r = await fetch('/api/findings.csv?'+qs(Object.assign({},base,chosen,{year:state.year,status:state.status})), find); }
    catch(e){ alert('The export did not come back (no connection). Try again in a moment.'); return; }
    if(!r.ok){ alert('The export did not come back ('+r.status+'). Try again in a moment.'); return; }
    const url = URL.createObjectURL(await r.blob()), a = document.createElement('a');
    a.href = url; a.download = 'remitwatch-findings.csv'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url), 10000); };
  const b = container.querySelector('#bulkAppealed'); if(b) b.onclick=async()=>{ const ids=[...container.querySelectorAll('.sel:checked')].map(x=>x.value); if(!ids.length || b.disabled) return;
    const seen = {}; container.querySelectorAll('.sel:checked').forEach(x=>{ const tr = x.closest('tr.row'); if(tr && tr.dataset.status) seen[x.value] = tr.dataset.status; });
    b.disabled = true;
    try { const out = await post('/api/findings/bulk-status', {ids, status:'appealed', seen}); bulkLeftAlone(out); } catch(e){ alert('Not saved: ' + e.message); }
    render(); };

    </table></div>
    <div class="panel"><h2>Analysis runs</h2><table><thead><tr><th>Run</th><th>Finished</th><th class="num">Lines</th><th class="num">Findings</th></tr></thead><tbody>${m.runs.map(r=>`<tr><td class="small">${esc(r.run_id)}</td><td class="small">${esc(r.finished_at)}</td><td class="num">${r.lines.toLocaleString()}</td><td class="num">${r.findings.toLocaleString()}</td></tr>`).join('')}</tbody></table></div>

function closeDetail(){
  const d = $('#drawer'); if(!d.classList.contains('open')) return;
  d.classList.remove('open'); d.inert = true;
  state.detailSeq = (state.detailSeq||0) + 1; state.detailId = null;
  if(/^#item=/.test(location.hash)) history.replaceState(null, '', '#' + state.tab);       // the address names the page again
  const back = state.detailFrom; state.detailFrom = null;
  if(state.dirty){ state.dirty = false; if(state.tab==='today' || state.tab==='fees' || DESKS[state.tab]){       // statuses changed: redraw the list behind
    render().then(()=>{ const r = document.querySelector('#view tr.row') || document.querySelector('#view button'); if(r) r.focus(); }); return; } }
  if(back && back.isConnected) back.focus();

// with an item open; o opens one. In an open item (features.js panelKey): Enter presses its main button; s, p, l and b open
// the Sent, Paid, Let go and Billed forms in the panel; n logs a call or portal check; e opens EMA; y copies the claim ID;
// 1 to 9 copy the route's fields and c all of them; u undoes the last change. / goes to the search box.
const KEYS = [['j','Next item'],['k','Previous item'],['o','Open the item'],['Enter','In an item: its main button'],['s','Mark it sent'],['p','Mark it paid'],['l','Let it go (asks why)'],
  ['b','Mark it billed'],['n','Log a call or portal check'],['e','Open it in EMA'],['y','Copy the claim ID'],['1 to 9','Copy that field of the route'],['c','Copy every filled field of the route'],
  ['u','Undo the last change'],['/','Search the list'],['Esc','Close the form, then the item'],['?','These shortcuts']];
function keysSheet(){

    <div class="keys" style="margin-top:10px">${KEYS.map(([k, w])=>`<span>${k.split(' or ').map(x=>`<kbd>${esc(x)}</kbd>`).join(' or ')}</span><span>${esc(w)}</span>`).join('')}</div>`;

}
document.addEventListener('keydown', e=>{
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  const t = e.target, typing = t && (/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName) || t.isContentEditable);
  if(typing || $('#modal').classList.contains('open')) return;
  const open = $('#drawer').classList.contains('open'), d = $('#drawer');
  const press = sel => { const b = d.querySelector(sel); if(b && !b.disabled){ b.click(); return true; } return false; };
  if(e.key === '?'){ e.preventDefault(); keysSheet(); return; }
  if(e.key === '/'){ const q = [...document.querySelectorAll('#view input[data-f="q"]')].find(x=>x.offsetParent!==null) || $('#claimFind'); if(q){ e.preventDefault(); q.focus(); } return; }
  if(open){
    // the panel's keys (features.js panelKey): s and l use the next step's own button, else the status menu's (each opens its
    // form in the panel: Let go always asks why)
    if(typeof panelKey === 'function') panelKey(e, d); else if(e.key === 'j') press('#nextItem');
    return;
  }
  const rows = [...document.querySelectorAll('#view tr.row[data-id]')]; if(!rows.length) return;
  const i = rows.indexOf(document.activeElement);
  if(e.key === 'j'){ e.preventDefault(); (rows[Math.min(rows.length - 1, i + 1)] || rows[0]).focus(); }
  else if(e.key === 'k'){ e.preventDefault(); (rows[Math.max(0, i - 1)] || rows[0]).focus(); }
  else if(e.key === 'o' && i >= 0){ e.preventDefault(); openDetail(rows[i].dataset.id); }
});

// The item's verdict, next step, story and EMA block (features.js), or the What to do box when they cannot be worked out.
// After a button that changes the item, the next one in the list opens (as "Mark sent and open the next" does), or the
// item again with its new state.
function xpFill(f, r, x, d, id, seq){
  const slot = d.querySelector('#xpSlot');
  if(!x.explain || typeof xpBoxHtml !== 'function'){
    slot.innerHTML = whatToDoHtml(f, '') + (x.explain_error ? `<div class="small muted">${esc(x.explain_error)}</div>` : '');
    slot.querySelectorAll('#prevItem, #nextItem').forEach(b => b.remove());       // Previous and Next are the head's
    bindWhatToDo(f, d, seq);         // the panel's own mark: the walk moves on only while this panel shows this item (H1)
    panelBindNav(f, d);
    // Let go asks why in the panel (a reason as a chip or in words), never in a browser box; saved, the next item opens
    const lg = slot.querySelector('#letGoNext'); if(lg) lg.onclick = () => { if(!lg.disabled && !walkGuarded()) stOpen(f, d, seq, 'dismissed'); };
    const kind = state.brief ? kindFor(state.brief, f) : '', b = d.querySelector('#builderFold');
    if(b && kind === 'note' && ['open','in_progress'].includes(f.status)) b.open = true;      // no next step to open it: open as before
  } else {
    state.detailX = x;
    xpRedrawBox(id, d, seq);
    const rs = d.querySelector('#xpRuleSlot');      // why the payer does not pay the code, where it almost never does
    if(rs && typeof xpPayerRuleHtml === 'function') rs.innerHTML = xpPayerRuleHtml(x.explain.why_unpaid);

  if(state.meta && state.meta.decisions) xpDecisions(id, d.querySelector('#xpWhy'));      // the run's decision log, where this build keeps one
}
// The next step's box, drawn again with the panel's answers as they are now (a packet built in the panel moves its main
// button on to the fax). Where the box offers the appeal itself (its packet, its fax), the panel's other ways to the same
// appeal (the letter button, the fax box's own button) step aside: one main button per item.
function xpRedrawBox(id, d, seq){
  const f = state.detailF, r = state.detailR, x = state.detailX, slot = d.querySelector('#xpSlot');
  if(!f || !r || !x || !x.explain || !slot || state.detailId !== id) return;
  // the panel still shows this item (hotfix 2, H1): an answer that comes after the person opened another item never
  // moves the panel; it is said in a notice
  const here = () => seq == null ? state.detailId === id : (typeof panelShows !== 'function' || panelShows(seq, id));
  slot.innerHTML = xpBoxHtml(f, x, r);
  const shown = xpEffective(f, x).explain, nx = shown.next_step || {};

  if(typeof panelFacts === 'function') panelFacts(f, x, d);      // the head's money and due date follow the next step
  const offers = (nx.buttons || []).some(k => k === 'build_packet' || k === 'fax_payer');
  // the panel never contradicts itself (CRITIQUE_biller 2): an item that is over, or one whose next step bills someone,
  // offers no appeal letter and no fax beside its next step
  const ws = (shown.verdict || {}).state || f.work_state, over = ['done', 'accepted', 'expired'].includes(ws);
  const bills = (nx.buttons || []).some(k => k === 'mark_billed' || k === 'billed_patient');
  const lr = d.querySelector('#letterRow'); if(lr) lr.hidden = offers || over || bills;

// #item=<finding id>: the item's panel, over whatever page is open (a finding id in a message is one click away)
function itemFromHash(){ const m = /^#item=([A-Za-z0-9_-]{1,80})$/.exec(location.hash); return m ? m[1] : null; }

// Opening the site looks for new remittances when nothing has for a few hours (TriZetto, Dropbox), then redraws the page
// once the run has finished and brought newer payments: paid claims leave the lists without anyone pressing Sync.
async function freshen(){
  let r; try { r = await api('/api/sync/freshen', {method:'POST'}); } catch(e){ return; }
  if(!r || !r.started) return;
  const before = state.meta && state.meta.remits ? state.meta.remits.last_payment : null;
  state.freshening = true; shellHeader();        // the pill says it looks for new payments (TriZetto, Dropbox) until the run ends
  try { await freshenWait(before); } finally { state.freshening = false; shellHeader(); }
}
async function freshenWait(before){
  for(let i = 0; i < 30; i++){
    await new Promise(ok => setTimeout(ok, 20000));
    let st; try { st = await api('/api/sync/status'); } catch(e){ continue; }
    if(st.running) continue;
    try { await loadMeta(); await refreshHeader(); } catch(e){}
    const now = state.meta && state.meta.remits ? state.meta.remits.last_payment : null;
    if(now !== before){ state.brief = null; render(); }
    return;
  }
}
window.addEventListener('hashchange', ()=>{ const item = itemFromHash(); if(item){ if(item !== state.detailId) openDetail(item); return; }
  const h=location.hash.slice(1); if(tabOpen(h) && h!==state.tab){ state.tab=h; render(); } });
// Leaving the page locks what the owner's password opened. A browser may keep the page as it was and bring it back
// on Back: it must come back locked, with nothing left on it.
window.addEventListener('pagehide', ()=>{ if(typeof pvForget === 'function') pvForget(); const v=$('#view'); if(v) v.innerHTML=''; sweepCharts(); });   // always: the calculator's figures can be in memory with no owner password set
window.addEventListener('pageshow', e=>{ if(e.persisted) render(); });
(async function(){
  if(location.hash && tabOpen(location.hash.slice(1))) state.tab=location.hash.slice(1);
  initNav();
  try { await loadMeta(); } catch(e){ if(!state.meta){ state.metaFailed = true; shellHeader(); } }
  // the brief (the 7-day badges on the category tabs, the labels) is asked once: the first page and the panel wait on this
  // same answer. The bell and the feed chip fill in when theirs come; the first rows never wait for them
  state.briefP = brief().catch(()=>null).finally(()=>{ state.briefP = null; shellHeader(); });
  refreshHeader();
  shellFeeds();
  const item = itemFromHash();
  if(!state.run) render();       // a click while the first answer was slow has drawn the page already
  if(item) openDetail(item);     // a link to one item: its panel over Today
  setInterval(async()=>{ try { await loadMeta(); await refreshHeader(); await shellFeeds(); } catch(e){} }, 120000);
  freshen();
})();
</script>
</body>
</html>
