<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in · RemitWatch</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f7f8fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0b0d11" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/static/brand/icon.svg" type="image/svg+xml">
<link rel="icon" href="/static/brand/icon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/static/brand/icon-180.png">
<!-- the theme a person chose on this computer is set before the first paint (static/signin.js), so nothing flashes; the
     page runs no script of its own inline (its Content-Security-Policy allows only scripts from this site) -->
<script src="/static/signin.js"></script>
<link rel="preload" href="/static/fonts/inter-latin-opsz-wght.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/static/rw.css?v=2026-11-28">
</head>
<body class="signin-body">
<main class="signin" id="main">
  <div class="signin-card">
    <div class="signin-brand"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M6.5 3.5h11a1 1 0 0 1 1 1v15.2l-2.4-1.5-2.3 1.5-1.8-1.5-1.8 1.5-2.3-1.5-2.4 1.5V4.5a1 1 0 0 1 1-1z" fill="currentColor"/><path class="cut" d="m8.6 11.6 2.3 2.3 4.6-4.9" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="signin-word">RemitWatch</span></div>
    <h1 class="signin-title">Sign in</h1>
    <p class="signin-lead">Use the practice's RemitWatch user name and password.</p>
    <p class="signin-note" id="siNote" role="status" hidden></p>
    <form class="signin-form" id="siForm" method="post" action="/api/signin" novalidate>
      <div class="field">
        <label for="siUser">User name</label>
        <input id="siUser" name="username" type="text" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="200" required autofocus>
      </div>
      <div class="field">
        <label for="siPass">Password</label>
        <input id="siPass" name="password" type="password" autocomplete="current-password" maxlength="1000" required>
      </div>
      <p class="signin-error" id="siErr" role="alert" hidden></p>
      <button class="primary signin-go" id="siGo" type="submit">Sign in</button>
    </form>
    <noscript><p class="signin-error">This page needs JavaScript. Turn it on for this site, then reload the page.</p></noscript>
    <p class="signin-foot">You stay signed in on this browser for up to 10 hours. On a shared computer, sign out when you finish.</p>
  </div>
</main>
</body>
</html>
