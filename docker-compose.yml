# One small host runs everything: the dashboard, the scheduler that pulls from Dropbox, and HTTPS.
#   docker compose up -d                  -> site on https://YOUR-HOST (set SITE_ADDRESS in .env)
#   docker compose exec app python -m remitwatch.cli cycle   -> run one cycle now, in the app's own container (the
#                                                               deploy and the app see it there and wait for it)
#   docker compose logs -f app            -> watch it
services:
  app:
    build:
      context: .
      # the commit the image is built from: kept in the image and shown on /api/health. The automatic deploy and
      # configure.sh pass it; a build without it shows null there
      args:
        REMITWATCH_COMMIT: ${REMITWATCH_COMMIT:-}
    command: serve
    env_file: .env
    expose: ["8000"]
    volumes: ["remitwatch-data:/data"]
    restart: unless-stopped
    # a stop (a deploy, configure.sh, a reboot) lets a request in progress finish first: one appeal fax takes about
    # a minute
    stop_grace_period: 120s
  caddy:
    image: caddy:2
    ports: ["80:80", "443:443"]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [app]
    restart: unless-stopped
volumes:
  remitwatch-data:
  caddy-data:
